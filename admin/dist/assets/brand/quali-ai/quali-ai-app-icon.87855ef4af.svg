<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">QualiAI app icon</title>
  <desc id="desc">Compact QualiAI app icon with a Q-shaped loop and AI node marks.</desc>
  <style>
    svg {
      --q-navy-900: #061F4A;
      --q-blue-500: #105BD8;
      --q-panel: #FFFFFF;
      --q-line: #D9E2EC;
    }
    .bg { fill: var(--q-navy-900); }
    .soft { fill: none; stroke: var(--q-line); stroke-width: 10; opacity: .34; }
    .loop { fill: none; stroke: var(--q-panel); stroke-width: 38; stroke-linecap: round; }
    .tail { fill: none; stroke: var(--q-blue-500); stroke-width: 30; stroke-linecap: round; }
    .node { fill: var(--q-blue-500); stroke: var(--q-panel); stroke-width: 10; }
  </style>
  <rect class="bg" x="32" y="32" width="448" height="448" rx="92"/>
  <rect class="soft" x="76" y="76" width="360" height="360" rx="58"/>
  <circle class="loop" cx="242" cy="238" r="114" pathLength="100" stroke-dasharray="78 22" transform="rotate(-34 242 238)"/>
  <path class="tail" d="M322 318 394 390"/>
  <circle class="node" cx="242" cy="124" r="20"/>
  <circle class="node" cx="128" cy="238" r="17"/>
  <circle class="node" cx="322" cy="318" r="19"/>
</svg>
