<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">QualiAI symbol</title>
  <desc id="desc">A compact Q-shaped quality loop with AI nodes and an evidence trace.</desc>
  <style>
    svg {
      --q-navy-900: #061F4A;
      --q-blue-700: #0B3D91;
      --q-blue-500: #105BD8;
      --q-panel: #FFFFFF;
      --q-line: #D9E2EC;
      --q-hold: #92400E;
    }
    .frame { fill: var(--q-panel); stroke: var(--q-navy-900); stroke-width: 10; }
    .inner { fill: none; stroke: var(--q-line); stroke-width: 4; }
    .loop { fill: none; stroke: var(--q-blue-700); stroke-width: 18; stroke-linecap: round; }
    .tail { fill: none; stroke: var(--q-blue-500); stroke-width: 14; stroke-linecap: round; }
    .trace { fill: none; stroke: var(--q-hold); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 8 8; }
    .node { fill: var(--q-panel); stroke: var(--q-navy-900); stroke-width: 5; }
    .node-fill { fill: var(--q-blue-500); }
  </style>
  <rect class="frame" x="24" y="24" width="208" height="208" rx="34"/>
  <rect class="inner" x="40" y="40" width="176" height="176" rx="22"/>
  <circle class="loop" cx="121" cy="119" r="56" pathLength="100" stroke-dasharray="78 22" transform="rotate(-34 121 119)"/>
  <path class="tail" d="M160 159 194 193"/>
  <path class="trace" d="M62 177c22-12 41 9 63-3 13-7 23-19 45-14"/>
  <circle class="node" cx="121" cy="63" r="11"/>
  <circle class="node" cx="65" cy="119" r="9"/>
  <circle class="node" cx="160" cy="159" r="10"/>
  <circle class="node-fill" cx="121" cy="63" r="4"/>
  <circle class="node-fill" cx="65" cy="119" r="3.5"/>
  <circle class="node-fill" cx="160" cy="159" r="4"/>
</svg>
