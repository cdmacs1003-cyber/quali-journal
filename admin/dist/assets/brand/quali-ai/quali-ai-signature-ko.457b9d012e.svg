<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">퀄리AI 가로형 시그니처</title>
  <desc id="desc">퀄리AI 워드마크와 Q 루프 엠블럼 조합.</desc>
  <style>
    svg {
      --q-navy-900: #061F4A;
      --q-blue-700: #0B3D91;
      --q-blue-500: #105BD8;
      --q-text-700: #323A45;
      --q-panel: #FFFFFF;
      --q-line: #D9E2EC;
      --q-font-main: "Noto Sans KR", system-ui, sans-serif;
    }
    .frame { fill: var(--q-panel); stroke: var(--q-navy-900); stroke-width: 8; }
    .inner { fill: none; stroke: var(--q-line); stroke-width: 3; }
    .loop { fill: none; stroke: var(--q-blue-700); stroke-width: 14; stroke-linecap: round; }
    .tail { fill: none; stroke: var(--q-blue-500); stroke-width: 11; stroke-linecap: round; }
    .node { fill: var(--q-panel); stroke: var(--q-navy-900); stroke-width: 4; }
    .node-fill { fill: var(--q-blue-500); }
    .wordmark { fill: var(--q-navy-900); font: 800 76px/1 var(--q-font-main); letter-spacing: 0; }
    .rule { fill: var(--q-text-700); font: 600 18px/1 var(--q-font-main); letter-spacing: 0; }
  </style>
  <g transform="translate(24 24)">
    <rect class="frame" x="0" y="0" width="172" height="172" rx="28"/>
    <rect class="inner" x="14" y="14" width="144" height="144" rx="18"/>
    <circle class="loop" cx="84" cy="82" r="46" pathLength="100" stroke-dasharray="78 22" transform="rotate(-34 84 82)"/>
    <path class="tail" d="M116 114 144 142"/>
    <circle class="node" cx="84" cy="36" r="9"/>
    <circle class="node" cx="38" cy="82" r="8"/>
    <circle class="node" cx="116" cy="114" r="8"/>
    <circle class="node-fill" cx="84" cy="36" r="3.5"/>
    <circle class="node-fill" cx="38" cy="82" r="3"/>
    <circle class="node-fill" cx="116" cy="114" r="3"/>
  </g>
  <text class="wordmark" x="238" y="103">퀄리AI</text>
  <text class="rule" x="242" y="142">근거 기반 품질 루프</text>
  <path d="M242 161h308" fill="none" stroke="var(--q-line)" stroke-width="4" stroke-linecap="round"/>
</svg>
