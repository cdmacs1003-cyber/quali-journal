name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}     # 예: quali-journal-prod
  REGION:     ${{ secrets.GCLOUD_REGION }}         # 예: asia-northeast3
  SERVICE:    ${{ secrets.CLOUD_RUN_SERVICE }}     # 예: quali-journal-admin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 0) 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Python 세팅 (해시 빌드 스크립트 실행용)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 2) (중요) 정적 자산 '콘텐츠 해시' 빌드
      #    -> admin/dist/index.html, admin/dist/assets/*.<hash>.* 생성
      - name: Build assets with content hash
        run: |
          python tools/build_assets_hash.py --clean
        shell: bash

      # 3) GCP 인증 (WIF)
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account:           ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      # 4) gcloud 설치
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 5) Cloud Run 배포 (소스 기반)
      #    - 빌드 시 admin/dist가 이미지에 포함되며,
      #      server_quali.py가 dist 우선 서빙 + 캐시 헤더를 적용합니다.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet
        shell: bash

      # 6) (선택) 최신 리비전에 100% 트래픽 전환
      - name: Shift traffic to latest
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --to-latest \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet
        shell: bash

