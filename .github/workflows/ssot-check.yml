name: SSOT Check

on:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        run: |
          set -e
          BASE="${{ github.base_ref }}"
          echo "Base ref: $BASE"
          git fetch origin "$BASE" --depth=1
          CHANGED_FILES=$(git diff --name-only "origin/$BASE"...HEAD || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          {
            echo "files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Guard SSOT docs with label
        run: |
          set -e
          CHANGED_FILES="${{ steps.changes.outputs.files }}"
          echo "CHANGED_FILES:"
          echo "$CHANGED_FILES"

          SSOT_DOC_CHANGED=$(echo "$CHANGED_FILES" | grep -E 'SSOT_.*\.md|Admin_DoD_.*\.md' || true)

          if [ -n "$SSOT_DOC_CHANGED" ]; then
            echo "SSOT 문서가 변경되었습니다:"
            echo "$SSOT_DOC_CHANGED"

            PR_NUMBER=${{ github.event.number }}
            REPO=${{ github.repository }}
            ISSUE_API="https://api.github.com/repos/$REPO/issues/$PR_NUMBER"

            LABELS_JSON=$(curl -sSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "$ISSUE_API")

            echo "Labels JSON: $LABELS_JSON"

            if echo "$LABELS_JSON" | grep -q '"name": "ssot-change"'; then
              echo "라벨 'ssot-change' 를 찾았습니다. 통과합니다."
            else
              echo "::error ::SSOT 파일이 변경되었지만 'ssot-change' 라벨이 없습니다."
              exit 1
            fi
          else
            echo "SSOT 문서 변경 없음"
          fi

      - name: Validate ci-deploy-prod.yml against DoD 12.4
        run: |
          set -e
          CHANGED_FILES="${{ steps.changes.outputs.files }}"
          FILE=".github/workflows/ci-deploy-prod.yml"

          if ! echo "$CHANGED_FILES" | grep -q "$FILE"; then
            echo "ci-deploy-prod.yml 변경 없음 → 이 단계는 건너뜁니다."
            exit 0
          fi

          if [ ! -f "$FILE" ]; then
            echo "::error ::$FILE 파일을 찾을 수 없습니다."
            exit 1
          fi

          echo "Checking $FILE"

          # 1) env 키 존재 여부
          for KEY in PROJECT_ID REGION SERVICE_NAME DEV_REGION DEV_SERVICE_NAME CLOUD_SQL_INSTANCE; do
            if ! grep -q "^[[:space:]]*$KEY:" "$FILE"; then
              echo "::error ::env.$KEY 가 $FILE 에 정의되어 있지 않습니다."
              exit 1
            fi
          done

          # 2) Deploy step의 image 소스 확인 (steps.dev-image.outputs.IMAGE 포함 여부)
          if ! grep -q 'steps.dev-image.outputs.IMAGE' "$FILE"; then
            echo "::error ::Deploy step의 image 가 steps.dev-image.outputs.IMAGE 를 사용하지 않습니다."
            exit 1
          fi

          # 3) environment.name == production
          if ! grep -q 'environment:' "$FILE" || ! grep -q 'name:[[:space:]]*production' "$FILE"; then
            echo "::error ::jobs.deploy.environment.name 이 production 이 아닙니다."
            exit 1
          fi

          # 4) Smoke step 이름/경로 체크
          if ! grep -q 'Smoke tests (/api/status, /api/report)' "$FILE"; then
            echo "::error ::Smoke step 이름 'Smoke tests (/api/status, /api/report)' 을 찾지 못했습니다."
            exit 1
          fi

          if ! grep -q 'Smoke tests (/api/standards/reviews)' "$FILE"; then
            echo "::error ::Smoke step 이름 'Smoke tests (/api/standards/reviews)' 을 찾지 못했습니다."
            exit 1
          fi

          if ! grep -q '/api/standards/reviews' "$FILE"; then
            echo "::error ::/api/standards/reviews 엔드포인트를 호출하는 코드가 없습니다."
            exit 1
          fi

          # 5) Reviews Gate Smoke 구조 체크 (Runbook A안 SSOT)

          # 5-1) smoke_once() 함수 정의 여부
          if ! grep -qF 'smoke_once() {' "$FILE" && ! grep -qF 'smoke_once () {' "$FILE"; then
            echo "::error ::Reviews 게이트 스텝에 smoke_once() 함수 정의가 없습니다."
            exit 1
          fi

          # 5-2) HTTP 200 상태 코드 검증
          if ! grep -qF 'if [ "$CODE" != "200" ]; then' "$FILE"; then
            echo "::error ::smoke_once 내에 HTTP 200 상태 코드 검증(if [ \"\$CODE\" != \"200\" ]; then)이 없습니다."
            exit 1
          fi

          # 5-3) .ok == true JSON 검증
          if ! grep -qF "jq -e '.ok == true'" "$FILE"; then
            echo "::error ::smoke_once 내에 '.ok == true' JSON 검증이 없습니다."
            exit 1
          fi

          # 5-4) .count/.items JSON 검증
          if ! grep -qF "jq -e '.count != null and .items != null'" "$FILE"; then
            echo "::error ::smoke_once 내에 '.count != null and .items != null' JSON 검증이 없습니다."
            exit 1
          fi

          # 5-5) Single smoke 로그 + if ! smoke_once; then 패턴
          if ! grep -qF '== Single smoke: /api/standards/reviews ==' "$FILE"; then
            echo "::error ::Single smoke 로그 '== Single smoke: /api/standards/reviews ==' 를 찾지 못했습니다."
            exit 1
          fi

          if ! grep -qF 'if ! smoke_once; then' "$FILE"; then
            echo "::error ::Single/Repeated 스모크 구간에 'if ! smoke_once; then' 패턴이 없습니다."
            exit 1
          fi

          # 5-6) 10회 반복 스모크 루프 + 로그
          if ! grep -qF '== 10x repeated smoke: /api/standards/reviews ==' "$FILE"; then
            echo "::error ::10회 반복 스모크 로그 '== 10x repeated smoke: /api/standards/reviews ==' 를 찾지 못했습니다."
            exit 1
          fi

          if ! grep -qF 'for i in $(seq 1 10); do' "$FILE"; then
            echo "::error ::Reviews 게이트 스텝에 'for i in $(seq 1 10); do' 루프가 없습니다."
            exit 1
          fi

          # 5-7) (권장) JSON schema OK 로그 메시지
          if ! grep -qF 'JSON schema OK (ok=true, count, items)' "$FILE"; then
            echo "::warning ::성공 로그 'JSON schema OK (ok=true, count, items)' 가 없습니다. 운영 로그 가독성이 떨어질 수 있습니다."
          fi

          echo "ci-deploy-prod.yml DoD 검증 통과"
