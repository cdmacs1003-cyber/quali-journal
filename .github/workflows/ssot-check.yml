name: SSOT Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SSOT – L3 B-canary workflow must exist and use stdreviews smoke script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = ".github/workflows/l3-b-canary-smoke.yml"

          if (-not (Test-Path $path)) {
            Write-Error "SSOT: L3 B-canary smoke workflow file '$path' must exist."
            exit 1
          }

          $content = Get-Content $path -Raw

          # 필수로 포함돼야 할 서브 문자열들만 느슨하게 체크
          $required = @(
            "name: L3 B-canary smoke",
            "Run L3 B-canary smoke",
            "smoke_stdreviews_A_gates.ps1",
            "Test-StdReviewRevisionSample"
          )

          foreach ($pattern in $required) {
            if ($content -notlike "*$pattern*") {
              Write-Error "SSOT: L3 B-canary workflow must contain substring: $pattern"
              exit 1
            }
          }

          Write-Host "SSOT: L3 B-canary workflow structure OK."

      - name: Detect changed files
        id: changes
        run: |
          set -e
          BASE="${{ github.base_ref }}"
          echo "Base ref: $BASE"
          git fetch origin "$BASE" --depth=1
          CHANGED_FILES=$(git diff --name-only "origin/$BASE"...HEAD || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          {
            echo "files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      
      - name: Guard SSOT docs with label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CHANGED_FILES="${{ steps.changes.outputs.files }}"
          echo "CHANGED_FILES:"
          echo "$CHANGED_FILES"
          SSOT_DOC_CHANGED=$(echo "$CHANGED_FILES" | grep -E 'SSOT_.*\.md|Admin_DoD_.*\.md' || true)


          if [ -n "$SSOT_DOC_CHANGED" ]; then
            echo "SSOT 문서 변경 감지:"
            echo "$SSOT_DOC_CHANGED"

            PR_NUMBER=$(echo "${{ github.event.pull_request.number }}" )
            if [ -z "$PR_NUMBER" ]; then
              echo "::error ::PR 번호를 찾을 수 없습니다."
              exit 1
            fi

            LABELS_JSON=$(gh api repos/${{ github.repository }}/issues/$PR_NUMBER/labels)
            echo "LABELS_JSON:"
            echo "$LABELS_JSON"

            if echo "$LABELS_JSON" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"ssot-change"'; then
              echo "라벨 'ssot-change' 를 찾았습니다. 통과합니다."
            else
              echo "::error ::SSOT 파일이 변경되었지만 'ssot-change' 라벨이 없습니다."
              exit 1
            fi
          else
            echo "SSOT 문서 변경 없음"
          fi

      - name: Validate ci-deploy-prod.yml against DoD 12.4
        run: |
          set -e
          CHANGED_FILES="${{ steps.changes.outputs.files }}"
          FILE=".github/workflows/ci-deploy-prod.yml"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if ! echo "$CHANGED_FILES" | grep -q "$FILE"; then
            echo "ci-deploy-prod.yml 이 변경되지 않았습니다. 검증을 건너뜁니다."
            exit 0
          fi

          echo "ci-deploy-prod.yml 변경 감지, DoD 검증을 수행합니다."

          if [ ! -f "$FILE" ]; then
            echo "::error ::ci-deploy-prod.yml 파일을 찾을 수 없습니다."
            exit 1
          fi

          echo "검증 대상 파일:"
          ls -l "$FILE"

          if ! grep -q 'name: Deploy to production' "$FILE"; then
            echo "::error ::ci-deploy-prod.yml 에 'name: Deploy to production' 스텝이 없습니다."
            exit 1
          fi

          if ! grep -q 'name: Run reviews JSON schema smoke' "$FILE"; then
            echo "::error ::ci-deploy-prod.yml 에 'Run reviews JSON schema smoke' 스텝이 없습니다."
            exit 1
          fi

          if ! grep -q 'jq -e' "$FILE"; then
            echo "::error ::ci-deploy-prod.yml 에 jq -e 조건 검증이 없습니다."
            exit 1
          fi

          if ! grep -q 'ok == true' "$FILE"; then
            echo "::error ::ci-deploy-prod.yml 에 'ok == true' 검증이 없습니다."
            exit 1
          fi

          if ! grep -q 'data.count != null' "$FILE"; then
            echo "::error ::ci-deploy-prod.yml 에 'data.count != null' 검증이 없습니다."
            exit 1
          fi

          if ! grep -q 'data.items != null' "$FILE"; then
            echo "::error ::ci-deploy-prod.yml 에 'data.items != null' 검증이 없습니다."
            exit 1
          fi

          if ! grep -q '\.count != null and \.items != null' "$FILE"; then
            echo "::error ::ci-deploy-prod.yml 에 최상위 count/items 검증 (fallback)이 없습니다."
            exit 1
          fi

          if ! grep -qF 'for i in $(seq 1 10); do' "$FILE"; then
            echo "::error ::Reviews 게이트 스텝에 'for i in $(seq 1 10); do' 루프가 없습니다."
            exit 1
          fi

          # 5-7) (권장) JSON schema OK 로그 메시지
          if ! grep -qF 'JSON schema OK (ok=true, count, items)' "$FILE"; then
            echo "::warning ::성공 로그 'JSON schema OK (ok=true, count, items)' 가 없습니다. 운영 로그 가독성이 떨어질 수 있습니다."
          fi

          echo "ci-deploy-prod.yml DoD 검증 통과"
