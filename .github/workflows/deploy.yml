name: Deploy to Cloud Run (safe rollout, generic)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Cloud Run service name"
        required: true
        type: string
      region:
        description: "Cloud Run region (e.g., asia-northeast1)"
        required: true
        default: "asia-northeast1"
      context:
        description: "Build context (admin or .)"
        required: true
        default: "."

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-generic
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GOOGLE_PROJECT }}
  REPO: ${{ secrets.ARTIFACT_REPO }}
  AR_REGION: asia-northeast3

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve context
        shell: bash
        run: |
          CTX="${{ inputs.context }}"
          if [ "$CTX" = "admin" ] && [ ! -d "admin" ]; then CTX="."; fi
          echo "CTX=$CTX" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gcloud

      - name: Build & Push
        run: |
          set -e
          IMAGE_TAG="${AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${{ inputs.service }}:${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          gcloud builds submit "$CTX" --tag "$IMAGE_TAG"

      - name: Deploy (no-traffic, labeled)
        run: |
          gcloud run deploy "${{ inputs.service }}" \
            --image "${IMAGE_TAG}" \
            --region "${{ inputs.region }}" \
            --project "${PROJECT_ID}" \
            --labels=commit-sha=${GITHUB_SHA},env=prod \
            --no-traffic \
            --allow-unauthenticated

      - name: Smoke /health
        shell: bash
        run: |
          set -e
          URL=$(gcloud run services describe "${{ inputs.service }}" --region "${{ inputs.region }}" --project "${PROJECT_ID}" --format='value(status.url)')
          curl -fsSL "${URL}/health"

      - name: Traffic split 5% → 20% → 50% → 100% (with rollback)
        shell: bash
        run: |
          set -e
          svc="${{ inputs.service }}"; region="${{ inputs.region }}"; proj="${PROJECT_ID}"
          URL=$(gcloud run services describe "$svc" --region "$region" --project "$proj" --format='value(status.url)')
          OLD_REV=$(gcloud run services describe "$svc" --region "$region" --project "$proj" --format='value(status.traffic[0].revisionName)')
          NEW_REV=$(gcloud run revisions list --service "$svc" --region "$region" --project "$proj" --sort-by="~createTime" --limit=1 --format='value(METADATA.name)')

          for PCT in 5 20 50; do
            gcloud run services update-traffic "$svc" --region "$region" --project "$proj" \
              --to-revisions ${OLD_REV}=$((100-PCT)),${NEW_REV}=${PCT}
            sleep 90
            curl -fsSL "${URL}/health" || {
              gcloud run services update-traffic "$svc" --region "$region" --project "$proj" \
                --to-revisions ${OLD_REV}=100
              exit 1
            }
          done

          gcloud run services update-traffic "$svc" --region "$region" --project "$proj" \
            --to-revisions ${NEW_REV}=100

      - name: Show traffic & labels
        run: |
          gcloud run revisions list \
            --region "${{ inputs.region }}" --project "${PROJECT_ID}" \
            --service "${{ inputs.service }}" \
            --sort-by="~createTime" --limit=10 \
            --format='table(METADATA.name, metadata.labels["commit-sha"]:label=COMMIT_SHA, createTime)'
