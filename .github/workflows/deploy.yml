name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# 이벤트/브랜치별 동시 실행 분리(중복 배포 방지)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: quali-journal-prod
  REGION: asia-northeast3
  SERVICE_NAME: quali-admin-domap
  ENTRYPOINT: "uvicorn server_quali:app --host 0.0.0.0 --port 8080"

jobs:
  # ✅ PR에서는 빠른 no-op 체크만 (실 배포 X)
  pr_check:
    if: ${{ github.event_name == 'pull_request' }}
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: PR no-op (preview handled by pr-preview.yml)
        run: echo "OK"

  # ✅ main / 수동 실행에서만 실제 배포
  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth (WIF - main/dispatch)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable required APIs (idempotent)
        shell: bash
        run: |
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            --quiet

      - name: Deploy to Cloud Run (main)
        shell: bash
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region  "$REGION" \
            --source  . \
            --allow-unauthenticated \
            --port 8080 \
            --set-build-env-vars "GOOGLE_ENTRYPOINT=${{ env.ENTRYPOINT }}" \
            --set-secrets "ADMIN_TOKEN=ADMIN_TOKEN:latest" \
            --quiet

      - name: Get Service URL
        id: url
        shell: bash
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Service URL: $URL"

      # 🔒 배포 직후 항상 최신 리비전에 100% 전환 (드리프트 방지)
      - name: Force traffic to latest
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" \
            --to-latest --region "$REGION" --project "$PROJECT_ID" --quiet

      # 🩺 간단 스모크 (토큰 없이 /health → 실패 시 토큰으로 /api/status)
      - name: Smoke check
        continue-on-error: true
        env:
          URL: ${{ steps.url.outputs.url }}
        shell: bash
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          if [ "$CODE" = "200" ]; then
            echo "✓ /health 200 OK"
            exit 0
          fi
          echo "Trying /api/status with ADMIN_TOKEN from Secret Manager..."
          TOKEN=$(gcloud secrets versions access latest --secret=ADMIN_TOKEN --project "$PROJECT_ID" 2>/dev/null || true)
          if [ -n "$TOKEN" ]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$URL/api/status")
            if [ "$CODE" = "200" ]; then
              echo "✓ /api/status 200 OK (Authorization: Bearer)"
              exit 0
            fi
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Admin-Token: $TOKEN" "$URL/api/status")
            if [ "$CODE" = "200" ]; then
              echo "✓ /api/status 200 OK (X-Admin-Token)"
              exit 0
            fi
          fi
          echo "::warning:: Smoke test returned $CODE (health) or failed status check."

      - name: Echo done
        shell: bash
        run: echo "✅ Deploy finished for $SERVICE_NAME in $REGION"

