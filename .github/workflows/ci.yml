name: CI

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # admin/ 가 있을 때만 Node 빌드/테스트 실행
      - name: Setup Node (admin)
        if: hashFiles('admin/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            admin/package-lock.json
            admin/pnpm-lock.yaml
            admin/yarn.lock

      - name: Install deps (admin)
        if: hashFiles('admin/package.json') != ''
        working-directory: admin
        run: npm ci

      - name: Lint & Test (admin)
        if: hashFiles('admin/package.json') != ''
        working-directory: admin
        run: |
          npm run -s lint || true
          npm test --if-present
