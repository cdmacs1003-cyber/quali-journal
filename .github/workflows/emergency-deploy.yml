# .github/workflows/emergency-deploy.yml
# 최종본: WIF(키 없음) 전용 / Cloud Run 소스 배포 / ADMIN_TOKEN은 Secret Manager로 주입

name: Deploy to Cloud Run (Emergency)

on:
  workflow_dispatch:               # 수동 실행
  push:
    branches: [ "main" ]           # main 푸시 시 자동
  pull_request:                    # PR 체크용
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  id-token: write                  # WIF(OIDC) 사용에 필수

# 동시 실행 제어(이 워크플로·브랜치별 단일 실행)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR에서는 빠른 no-op만(실배포 X)
  pr_check:
    if: ${{ github.event_name == 'pull_request' }}
    name: Deploy to Cloud Run (PR check)
    runs-on: ubuntu-latest
    steps:
      - run: echo "OK (no deploy on PR)"

  # main/수동 실행에서만 실제 배포
  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 0) 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 1) WIF 인증 (JSON 키 사용 금지)
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
          token_format: "access_token"

      # 2) gcloud 설치
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # 3) 필요한 API 보장(멱등)
      - name: Enable required APIs
        shell: bash
        run: |
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            --quiet

      # 4) Cloud Run 배포(소스에서 빌드 → 배포)
      #    - 실행 SA 지정: GOOGLE_SERVICE_ACCOUNT (선택)
      #    - ADMIN_TOKEN: Secret Manager 연결
      #    - API_KEY: 있으면 평문 ENV로 주입
      - name: Deploy to Cloud Run
        shell: bash
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION:     ${{ secrets.CLOUD_RUN_REGION }}
          SERVICE:    ${{ secrets.CLOUD_RUN_SERVICE }}
          RUN_SA:     ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}   # 예) quali-run-sa@... (없으면 비워둠)
          ADMIN_TOKEN_SECRET_NAME: ADMIN_TOKEN                # Secret Manager 시크릿 이름
          API_KEY:    ${{ secrets.API_KEY }}                  # 선택
        run: |
          set -euo pipefail

          SA_OPT=""
          if [[ -n "${RUN_SA:-}" ]]; then
            SA_OPT="--service-account ${RUN_SA}"
          fi

          ENV_OPTS=""
          if [[ -n "${API_KEY:-}" ]]; then
            ENV_OPTS="--update-env-vars API_KEY=${API_KEY}"
          fi

          SECRET_OPTS="--set-secrets ${ADMIN_TOKEN_SECRET_NAME}=${ADMIN_TOKEN_SECRET_NAME}:latest"

          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region  "${REGION}" \
            --source  . \
            ${SA_OPT} \
            ${ENV_OPTS} \
            ${SECRET_OPTS} \
            --allow-unauthenticated \
            --quiet

      # 5) 서비스 URL 출력
      - name: Get Service URL
        id: url
        shell: bash
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION:     ${{ secrets.CLOUD_RUN_REGION }}
          SERVICE:    ${{ secrets.CLOUD_RUN_SERVICE }}
        run: |
          URL=$(gcloud run services describe "${SERVICE}" \
                 --project "${PROJECT_ID}" --region "${REGION}" \
                 --format='value(status.url)')
          echo "Service URL: ${URL}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      # 6) 배포 직후 최신 리비전에 100% 전환(드리프트 방지)
      - name: Force traffic to latest
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION:     ${{ secrets.CLOUD_RUN_REGION }}
          SERVICE:    ${{ secrets.CLOUD_RUN_SERVICE }}
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --to-latest --region "${REGION}" --project "${PROJECT_ID}" --quiet

      # 7) 스모크 테스트(토큰 자동 주입, 200 기대)
      - name: Smoke check
        continue-on-error: true
        shell: bash
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          URL: ${{ steps.url.outputs.url }}
        run: |
          set -e
          echo "Health ping: ${URL}/health"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health")
          if [ "$CODE" = "200" ]; then
            echo "✓ /health 200 OK"
            exit 0
          fi

          echo "Trying /api/status with token from Secret Manager..."
          TOKEN=$(gcloud secrets versions access latest --secret=ADMIN_TOKEN --project "${PROJECT_ID}" 2>/dev/null || true)
          if [ -n "$TOKEN" ]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "${URL}/api/status")
            if [ "$CODE" = "200" ]; then
              echo "✓ /api/status 200 OK (Authorization: Bearer)"
              exit 0
            fi
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Admin-Token: $TOKEN" "${URL}/api/status")
            if [ "$CODE" = "200" ]; then
              echo "✓ /api/status 200 OK (X-Admin-Token)"
              exit 0
            fi
          fi
          echo "::warning:: Smoke test returned HTTP ${CODE}"

      - name: Done
        shell: bash
        run: echo "✅ Deploy finished for ${{ secrets.CLOUD_RUN_SERVICE }} in ${{ secrets.CLOUD_RUN_REGION }}"
