name: deploy

on:
  push:
    branches: [ "main" ]       # main으로 push될 때 자동 배포
  workflow_dispatch:           # 필요 시 수동 실행

permissions:
  contents: read
  id-token: write              # WIF(OIDC) 토큰용 권한

env:
  # ==== SSOT ====
  PROJECT_ID:        quali-journal-prod
  REGION:            asia-northeast1      # prod(domap) 리전
  SERVICE_NAME:      quali-admin-domap
  AR_REPO:           containers
  RUNTIME_SA:        quali-run-sa

  # 기존 PROD 이미지 태그(백업용, 지금 배포에는 사용하지 않음)
  IMAGE: asia-northeast1-docker.pkg.dev/quali-journal-prod/containers/quali-admin-domap:${{ github.sha }}

  # dev 서비스(이미지 SSOT)
  DEV_REGION:        asia-northeast3
  DEV_SERVICE_NAME:  quali-journal-admin-dev

  CLOUD_SQL_INSTANCE: quali-pg

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      # 0) 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 1) WIF(OIDC)로 GCP 인증
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account:           ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
          project_id:                ${{ env.PROJECT_ID }}

      # 2) gcloud CLI 세팅
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # 3) Cloud SQL STOP Policy 가드레일 (STOP이면 배포 차단)
      - name: Guardrail - Cloud SQL STOP Policy
        run: |
          set -e
          PROJECT_ID="${{ env.PROJECT_ID }}"
          INSTANCE="${{ env.CLOUD_SQL_INSTANCE }}"
          echo "Checking Cloud SQL instance: $INSTANCE in project: $PROJECT_ID"

          STATE=$(gcloud sql instances describe "$INSTANCE" \
                    --project "$PROJECT_ID" \
                    --format="value(state)")
          POLICY=$(gcloud sql instances describe "$INSTANCE" \
                    --project "$PROJECT_ID" \
                    --format="value(settings.activationPolicy)")

          echo "Cloud SQL state=$STATE, activationPolicy=$POLICY"

          if [ "$STATE" != "RUNNABLE" ]; then
            echo "Cloud SQL STOP Policy: instance is not RUNNABLE (state=$STATE)."
            echo "배포 차단: Cloud SQL이 STOP 상태이므로 DB 의존 배포/테스트를 진행하지 않습니다."
            exit 1
          fi

          echo "Cloud SQL RUNNABLE - 배포 계속 진행"

      # 4) dev 서비스에서 사용 중인 이미지 재사용 (build once, promote)
      - name: Get image from dev service (SSOT)
        id: dev-image
        run: |
          set -e
          PROJECT_ID="${{ env.PROJECT_ID }}"
          DEV_REGION="${{ env.DEV_REGION }}"
          DEV_SERVICE="${{ env.DEV_SERVICE_NAME }}"

          IMAGE=$(gcloud run services describe "$DEV_SERVICE" \
                    --region "$DEV_REGION" \
                    --project "$PROJECT_ID" \
                    --format="value(spec.template.spec.containers[0].image)")

          if [ -z "$IMAGE" ]; then
            echo "ERROR: dev service image not found"
            exit 1
          fi

          echo "IMAGE=$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"

      # 5) Cloud Run에 이미지 배포
      - name: Deploy to Cloud Run (image)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id:  ${{ env.PROJECT_ID }}
          region:      ${{ env.REGION }}
          service:     ${{ env.SERVICE_NAME }}
          image:       ${{ steps.dev-image.outputs.IMAGE }}
          env_vars: |
            PYTHONUTF8=1
            PYTHONIOENCODING=utf-8
            COMMIT_SHA=${{ github.sha }}
            ALLOWED_ORIGINS=https://admin.standardai.co.kr
          secrets: |
            ADMIN_TOKEN=ADMIN_TOKEN:latest
          flags: >
            --allow-unauthenticated
            --service-account=${{ env.RUNTIME_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          update_traffic_flags: --to-latest

      # 6) 배포된 서비스 URL 확인
      - name: Show deployed service URL
        id: url
        run: |
          SERVICE_NAME="${{ env.SERVICE_NAME }}"
          REGION="${{ env.REGION }}"
          PROJECT_ID="${{ env.PROJECT_ID }}"
          URL=$(gcloud run services describe "$SERVICE_NAME" \
                --region "$REGION" \
                --project "$PROJECT_ID" \
                --format="value(status.url)")
          echo "URL=$URL"
          echo "URL=$URL" >> "$GITHUB_OUTPUT"

      # 7) Warmup: /health 200 나올 때까지 대기
      - name: Warmup (wait for /health 200)
        run: |
          set -e
          URL="${{ steps.url.outputs.URL }}"
          echo "URL=$URL"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || true)
            echo "try $i: $code"
            if [ "$code" = "200" ]; then
              echo "health OK"
              exit 0
            fi
            sleep 3
          done
          echo "warmup failed: /health not ready"
          exit 1

      # 8) Smoke test: /api/status, /api/report 200 확인
      - name: Smoke tests (/api/status, /api/report)
        run: |
          set -e
          URL="${{ steps.url.outputs.URL }}"
          PROJECT_ID="${{ env.PROJECT_ID }}"
          TOKEN=$(gcloud secrets versions access latest \
                    --secret=ADMIN_TOKEN \
                    --project "$PROJECT_ID" | tr -d '\r\n')
          for P in /api/status /api/report; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "X-Admin-Token: $TOKEN" \
                    "$URL$P" || true)
            echo "$P -> $code"
            [ "$code" = "200" ] || (echo "Smoke failed: $P $code" && exit 1)
          done
          echo "Smoke OK"

      - name: Smoke tests (/api/standards/reviews)
        run: |
          set -e
          URL="${{ steps.url.outputs.URL }}"
          PROJECT_ID="${{ env.PROJECT_ID }}"

          # ADMIN_TOKEN 시크릿에서 토큰 읽기 (A1 Runbook과 동일 SSOT)
          TOKEN=$(gcloud secrets versions access latest \
                    --secret=ADMIN_TOKEN \
                    --project "$PROJECT_ID" | tr -d '\r\n')

          smoke_once() {
            echo "---- /api/standards/reviews smoke (single call) ----"

            # 응답 바디 + HTTP 코드 둘 다 얻기
            RESP=$(curl -sS -w "\n%{http_code}" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "X-Admin-Token: $TOKEN" \
                    "$URL/api/standards/reviews" || echo -e "\n000")

            BODY=$(printf "%s\n" "$RESP" | sed '$d')
            CODE=$(printf "%s\n" "$RESP" | tail -n 1)

            echo "HTTP code: $CODE"

            if [ "$CODE" != "200" ]; then
              echo "❌ /api/standards/reviews StatusCode != 200"
              return 1
            fi

          # jq로 JSON 구조 검증 (실제 /api/standards/reviews 스키마 기준: ok + count + items)
          if ! echo "$BODY" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "❌ body.ok != true"
            return 1
          fi

          # 최상위에 count, items 가 존재하는지 검사
          if ! echo "$BODY" | jq -e '.count != null and .items != null' >/dev/null 2>&1; then
            echo "❌ count/items 가 유효하지 않음"
            return 1
          fi

          echo "✅ /api/standards/reviews JSON schema OK (ok=true, count, items)"


            return 0
          }

          echo "== Single smoke: /api/standards/reviews =="
          if ! smoke_once; then
            echo "❌ /api/standards/reviews single smoke failed"
            exit 1
          fi

          # [Scenario B] intentionally break 10x loop for SSOT test (feature/test-ssot-break-loop-10x)
          echo "⚠️ /api/standards/reviews 10x loop temporarily disabled for SSOT scenario B test"


          
