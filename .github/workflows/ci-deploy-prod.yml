name: deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # SSOT
  PROJECT_ID: quali-journal-prod
  REGION: asia-northeast1
  SERVICE_NAME: quali-admin-domap
  AR_REPO: containers
  RUNTIME_SA: quali-run-sa

  # Image tag — commit SHA
  IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/quali-admin:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF/OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Push image (Artifact Registry)
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run (image mode)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          revision_traffic: "LATEST=100"
          env_vars: |
            PYTHONUNBUFFERED=1
            PYTHONUTF8=1
            COMMIT_SHA=${{ github.sha }}
          secrets: |
            ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}
          flags: >
            --service-account=${{ env.RUNTIME_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --timeout=300

      - name: Show deployed service URL
        id: url
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --project $PROJECT_ID --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "$URL"

      - name: Warmup (wait for /health 200)
        shell: bash
        run: |
          set -e
          URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --project $PROJECT_ID --format='value(status.url)')
          echo "URL=$URL"
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
            echo "try $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 3
          done
          echo "warmup failed: /health not ready"
          exit 1

      - name: Smoke tests (health/status/report)
        shell: bash
        run: |
          set -e
          URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --project $PROJECT_ID --format='value(status.url)')
          for p in /health /api/status /api/report; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$p")
            echo "$p -> $code"
            test "$code" = "200"
          done\n
