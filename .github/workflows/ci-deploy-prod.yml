name: deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # ==== SSOT ====
  PROJECT_ID:        quali-journal-prod
  REGION:            asia-northeast1          # Cloud Run 서비스 리전(도쿄)
  SERVICE_NAME:      quali-admin-domap
  AR_REPO:           containers               # Artifact Registry repo 이름
  RUNTIME_SA:        quali-run-sa             # 런타임 서비스계정(짧은 이름)

  # 이미지 풀 경로
  IMAGE: asia-northeast1-docker.pkg.dev/quali-journal-prod/containers/quali-admin:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- OIDC 로그인
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # --- Docker Build & Push (Artifact Registry)
      - name: Configure Docker auth (AR)
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image (disabled; using source deploy)
        if: ${{ false }}
        run: echo "disabled"

      - name: Push image (disabled; using source deploy)
        if: ${{ false }}
        run: echo "disabled"

      # --- Cloud Run Deploy (이미지 모드)
      - name: Deploy to Cloud Run (source: admin/)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id:  ${{ env.PROJECT_ID }}
          region:      ${{ env.REGION }}
          service:     ${{ env.SERVICE_NAME }}
          source:      admin
          allow_unauthenticated: true
          service_account: ${{ env.RUNTIME_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          # Cloud Build에서 uvicorn 진입점 지정(WSL/도커 없이 동일하게 구동)
          build_env_vars: |
            GOOGLE_ENTRYPOINT=uvicorn admin.server_quali:app --host 0.0.0.0 --port 8080
          # 런타임 환경변수
          env_vars: |
            PYTHONUTF8=1
            PYTHONIOENCODING=utf-8
            COMMIT_SHA=${{ github.sha }}
            ALLOWED_ORIGINS=https://admin.standardai.co.kr
          # Secret Manager
          secrets: |
            ADMIN_TOKEN=ADMIN_TOKEN:latest
          update_traffic_flags: --to-latest


      # --- 서비스 URL 출력
      - name: Show deployed service URL
        id: url
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format="value(status.url)")
          echo "URL=$URL"
          echo "URL=$URL" >> $GITHUB_OUTPUT

      # --- Warmup: /health 200까지 대기 (최대 ~3분)
      - name: Warmup (wait for /health 200)
        run: |
          set -e
          URL="${{ steps.url.outputs.URL }}"
          echo "URL=$URL"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || true)
            echo "try $i: $code"
            if [ "$code" = "200" ]; then
              echo "health OK"
              exit 0
            fi
            sleep 3
          done
          echo "warmup failed: /health not ready"
          exit 1

      # --- Smoke (토큰 필요 엔드포인트 200 확인)
      - name: Smoke tests (/api/status, /api/report)
        run: |
          set -e
          URL="${{ steps.url.outputs.URL }}"
          TOKEN=$(gcloud secrets versions access latest --secret=ADMIN_TOKEN --project "$PROJECT_ID" | tr -d '\r\n')
          for P in /api/status /api/report; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "X-Admin-Token: $TOKEN" "$URL$P" || true)
            echo "$P -> $code"
            [ "$code" = "200" ] || (echo "Smoke failed: $P $code" && exit 1)
          done
          echo "Smoke OK"
