name: deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: quali-journal-prod
  REGION: asia-northeast1
  SERVICE_NAME: quali-admin-domap
  AR_REPO: containers
  RUNTIME_SA: quali-run-sa

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: prod-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # 1) 저장소 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2) OIDC 인증
      - name: Auth to Google Cloud (WIF/OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account:          ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
          project_id:               ${{ env.PROJECT_ID }}

      # 3) gcloud 설치 및 프로젝트 설정
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4) (선택) 정적 자산 해시 빌드
      - name: Build hashed assets (optional)
        shell: bash
        run: |
          set -e
          if [ -d "./admin" ]; then
            echo "[assets] admin/ 감지 → 해시 빌드"
            if [ -f "./tools/build_assets_hash.py" ]; then
              python ./tools/build_assets_hash.py --clean || true
            else
              echo "[assets] build_assets_hash.py 없음 → 스킵"
            fi
          else
            echo "[assets] admin/ 디렉토리 없음 → 스킵"
          fi

      # 5) Artifact Registry 인증
      - name: Configure Docker auth
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" -q

      # 6) 이미지 빌드 및 푸시
      - name: Build & Push image
        shell: bash
        run: |
          set -e
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/quali-admin:${{ github.sha }}"
          echo "Building image: $IMAGE"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
        env:
          DOCKER_BUILDKIT: 1

      # 7) Cloud Run 배포 (이미지 모드)
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service:    ${{ env.SERVICE_NAME }}
          region:     ${{ env.REGION }}
          image:      ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/quali-admin:${{ github.sha }}
          # 런타임 환경변수
          env_vars: |
            PYTHONUTF8=1
            PYTHONIOENCODING=utf-8
            COMMIT_SHA=${{ github.sha }}
          # Secret Manager 시크릿
          secrets: |
            ADMIN_TOKEN=ADMIN_TOKEN:latest
          # gcloud 플래그는 하나의 flags 블록에서 정의
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.RUNTIME_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --timeout=300
          # 최신 리비전에 100% 트래픽 전환
          revision_traffic: "LATEST=100"

      # 8) Smoke 테스트
      - name: Smoke tests
        shell: bash
        run: |
          set -e
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}" --format='value(status.url)')
          echo "Cloud Run URL: $URL"
          HEALTH=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health")
          TOKEN=$(gcloud secrets versions access latest --secret=ADMIN_TOKEN --project "${{ env.PROJECT_ID }}")
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Admin-Token: $TOKEN" "$URL/api/status")
          REPORT=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Admin-Token: $TOKEN" -X POST -H "Content-Length: 0" "$URL/api/report")
          echo "HEALTH=$HEALTH STATUS=$STATUS REPORT=$REPORT"
          if [ "$HEALTH" != "200" ] || [ "$STATUS" != "200" ] || [ "$REPORT" != "200" ]; then
            echo "Smoke tests failed" >&2
            exit 1
          fi
