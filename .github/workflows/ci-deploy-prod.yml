name: Deploy (prod)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # WIF 필수

    steps:
      - uses: actions/checkout@v4

      # 1) WIF 인증
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: quali-journal-prod

      # 2) Cloud Run 배포 (deploy-cloudrun@v2 정식 키만 사용)
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: quali-journal-admin
          region: asia-northeast3
          project_id: quali-journal-prod
          source: .                      # Dockerfile 빌드/배포
          # ❗ 'allow_unauthenticated' 같은 잘못된 키 쓰지 말고 flags 사용
          flags: --allow-unauthenticated
          # ❗ Secret/Env는 액션의 공식 입력 사용 (줄바꿈 OK)
          secrets: |
            ADMIN_TOKEN=ADMIN_TOKEN:latest
          env_vars: |
            PYTHONUTF8=1,PYTHONIOENCODING=utf-8
