name: deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # ==== SSOT ====
  PROJECT_ID:        quali-journal-prod
  REGION:            asia-northeast1
  SERVICE_NAME:      quali-admin-domap
  AR_REPO:           containers
  RUNTIME_SA:        quali-run-sa

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- OIDC 로그인
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Prepare build context (python buildpacks ready)
        shell: bash
        run: |
          set -e
          mkdir -p admin
          # 1) Buildpacks용 요구사항 파일 보장
          if [ -f requirements.txt ]; then
            cp -f requirements.txt admin/requirements.txt
          else
            printf "fastapi\nuvicorn[standard]\npython-dotenv\n" > admin/requirements.txt
          fi
          # 2) Buildpacks용 Procfile(엔트리 고정)
          printf "web: uvicorn admin.server_quali:app --host 0.0.0.0 --port \${PORT}\n" > admin/Procfile
          # 3) 점검 출력
          echo "[admin dir list]"; ls -al admin | sed -n '1,80p'
          echo "[requirements head]"; head -n 40 admin/requirements.txt || true
          echo "[procfile]"; cat admin/Procfile

      - name: Prepare build context (copy requirements.txt for buildpacks)
        shell: bash
        run: |
          set -e
          # 1) admin 폴더 보장(없으면 생성)
          mkdir -p admin
          # 2) 루트 requirements.txt가 있으면 복사, 없으면 최소본 생성
          if [ -f requirements.txt ]; then
            cp requirements.txt admin/requirements.txt
          else
            printf "fastapi\nuvicorn[standard]\n" > admin/requirements.txt
          fi
          # 3) 확인 출력
          echo "== admin dir =="
          ls -al admin | sed -n '1,80p'
          echo "== preview requirements.txt =="
          head -n 40 admin/requirements.txt || true

 
      # --- Cloud Run Deploy (소스 배포: admin)
      - name: Deploy to Cloud Run (source admin)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id:  ${{ env.PROJECT_ID }}
          region:      ${{ env.REGION }}
          service:     ${{ env.SERVICE_NAME }}
          source:      admin
          allow_unauthenticated: true
          service_account: ${{ env.RUNTIME_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          build_env_vars: |
            GOOGLE_ENTRYPOINT=uvicorn admin.server_quali:app --host 0.0.0.0 --port 8080
            BP_CPYTHON_VERSION=3.11.*
          env_vars: |
            PYTHONUTF8=1
            PYTHONIOENCODING=utf-8
            COMMIT_SHA=${{ github.sha }}
            ALLOWED_ORIGINS=https://admin.standardai.co.kr
          secrets: |
            ADMIN_TOKEN=ADMIN_TOKEN:latest
          update_traffic_flags: --to-latest



      # --- 서비스 URL 출력
      - name: Show deployed service URL
        id: url
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format="value(status.url)")
          echo "URL=$URL"
          echo "URL=$URL" >> $GITHUB_OUTPUT

      # --- Warmup: /health 200까지 대기
      - name: Warmup (wait for /health 200)
        run: |
          set -e
          URL="${{ steps.url.outputs.URL }}"
          echo "URL=$URL"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || true)
            echo "try $i: $code"
            if [ "$code" = "200" ]; then
              echo "health OK"
              exit 0
            fi
            sleep 3
          done
          echo "warmup failed: /health not ready"
          exit 1

      # --- Smoke (토큰 필요 엔드포인트 확인)
      - name: Smoke tests (/api/status, /api/report)
        run: |
          set -e
          URL="${{ steps.url.outputs.URL }}"
          TOKEN=$(gcloud secrets versions access latest --secret=ADMIN_TOKEN --project "$PROJECT_ID" | tr -d '\r\n')
          for P in /api/status /api/report; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "X-Admin-Token: $TOKEN" "$URL$P" || true)
            echo "$P -> $code"
            [ "$code" = "200" ] || (echo "Smoke failed: $P $code" && exit 1)
          done
          echo "Smoke OK"
