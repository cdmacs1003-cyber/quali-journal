name: CI/CD – Prod (Cloud Run)
on:
  push:   { branches: [ "main" ] }
  workflow_dispatch: {}
permissions: { contents: read, id-token: write }
env:
  PROJECT_ID: quali-journal-prod
  REGION: asia-northeast1
  SERVICE_NAME: quali-admin-domap
  AR_REPO: containers
  IMAGE_URI: $\{{ env.REGION }}-docker.pkg.dev/$\{{ env.PROJECT_ID }}/$\{{ env.AR_REPO }}/quali-admin:$\{{ github.sha }}
concurrency: { group: prod-$\{{ github.ref }}, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with: { workload_identity_provider: $\{{ secrets.GOOGLE_WIF_PROVIDER }}, service_account: $\{{ secrets.GCP_DEPLOY_SA_EMAIL }} }
      - uses: google-github-actions/setup-gcloud@v2
        with: { project_id: $\{{ env.PROJECT_ID }} }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Build hashed assets (auto-detect)
        shell: bash
        run: |
          set -e
          if [ -d "./admin" ]; then
            if [ -f "./tools/build_assets_hash.py" ]; then
              python ./tools/build_assets_hash.py --clean || true
            else
              echo "[assets] script 없음  스킵"
            fi
          else
            echo "[assets] admin/ 없음  스킵(배포 OK)"
          fi
      - name: Configure Docker auth
        run: gcloud auth configure-docker "$\{{ env.REGION }}-docker.pkg.dev" -q
      - name: Build & Push image
        run: |
          docker build -t "$\{{ env.IMAGE_URI }}" .
          docker push "$\{{ env.IMAGE_URI }}"
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: $\{{ env.SERVICE_NAME }}
          region:  $\{{ env.REGION }}
          image:   $\{{ env.IMAGE_URI }}
          flags: >-
            --allow-unauthenticated
            --service-account=run-exec-admin@$\{{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --set-secrets=ADMIN_TOKEN=ADMIN_TOKEN:latest
          env_vars: >-
            PYTHONUTF8=1
            COMMIT_SHA=$\{{ github.sha }}
      - name: Force traffic to latest
        run: gcloud run services update-traffic "" --to-latest --region "" --project ""
      - name: Smoke tests
        shell: bash
        run: |
          set -e
          URL=
          H=
          TOK=
          S=
          R=
          echo "health= status=quali-admin-domap report=asia-northeast1"
          test "" = "200" -a "quali-admin-domap" = "200" -a "asia-northeast1" = "200"
