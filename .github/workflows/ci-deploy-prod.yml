name: deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# ----- SSOT (한 곳에서만 바꾸면 됨) -----
env:
  PROJECT_ID: quali-journal-prod
  REGION: asia-northeast1
  SERVICE_NAME: quali-admin-domap
  AR_REPO: containers
  RUNTIME_SA: quali-run-sa

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Artifact Registry docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/quali-admin:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t "$IMAGE" .

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/quali-admin:${{ github.sha }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          allow_unauthenticated: true
          service_account: ${{ env.RUNTIME_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          revision_traffic: "LATEST=100"
          env_vars: |
            PYTHONUTF8=1
            PYTHONIOENCODING=utf-8
            COMMIT_SHA=${{ github.sha }}
          secrets: |
            ADMIN_TOKEN=projects/${{ env.PROJECT_ID }}/secrets/ADMIN_TOKEN:latest

      - name: Show deployed service URL
        run: echo "URL=${{ steps.deploy.outputs.url }}"

      - name: Warmup (wait for /health 200)
        run: |
          set -e
          URL="${{ steps.deploy.outputs.url }}"
          echo "URL=${URL}"
          for i in $(seq 1 60); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "${URL}/health" || true)
            echo "try $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 3
          done
          echo "warmup failed: /health not ready"; exit 1

      - name: Smoke tests (health/status/report)
        run: |
          set -e
          URL="${{ steps.deploy.outputs.url }}"
          curl -fsS "${URL}/health"
          curl -fsS "${URL}/api/status"
          curl -fsS -H "Content-Type: application/json" --data '{}' "${URL}/api/report"
