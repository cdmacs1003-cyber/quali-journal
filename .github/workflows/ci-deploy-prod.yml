name: deploy

on:
  push:
    branches: [ "main" ]
    # 스모크 yml만 수정했을 땐 배포 자동실행 방지
    paths-ignore:
      - '.github/workflows/oidc-smoke.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

# SSOT
env:
  PROJECT_ID: quali-journal-prod
  REGION: asia-northeast1            # 도메인 매핑 리전
  SERVICE_NAME: quali-admin-domap    # 라이브 서비스
  ENTRYPOINT: "uvicorn server_quali:app --host 0.0.0.0 --port 8080"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-run-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC(WIF) 인증
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account:          ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
          project_id:               ${{ env.PROJECT_ID }}
          create_credentials_file:  true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 소스 배포(빌드팩) — admin 컨텍스트만 빌드
      - name: Deploy to Cloud Run (source)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service:    ${{ env.SERVICE_NAME }}
          region:     ${{ env.REGION }}
          source:     admin
          # 런타임 환경변수
          env_vars: |
            PYTHONUTF8=1
            PYTHONIOENCODING=utf-8
            COMMIT_SHA=${{ github.sha }}
          # Secret Manager → 컨테이너 env
          secrets: |
            ADMIN_TOKEN=ADMIN_TOKEN:latest
          # 기본 라벨 중복 방지
          skip_default_labels: true
          # v2 입력 규격: build_env_vars 대신 flags로 전달
          flags: >
            --allow-unauthenticated
            --set-build-env-vars=GOOGLE_ENTRYPOINT="${{ env.ENTRYPOINT }}"
          # 최신 리비전에 100% 전환 (문법 고정)
          revision_traffic: "LATEST=100"

      - name: Show deployed service URL
        env:
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          REGION:       ${{ env.REGION }}
          PROJECT_ID:   ${{ env.PROJECT_ID }}
        run: |
          gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format="value(status.url)"

      # 배포 스모크(헬스/상태/리포트 200)
      - name: Smoke tests (health/status/report)
        env:
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          REGION:       ${{ env.REGION }}
          PROJECT_ID:   ${{ env.PROJECT_ID }}
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          echo "URL=$URL"
          H=$(curl -s -o /dev/null -w '%{http_code}\n' "$URL/health")
          TOK=$(gcloud secrets versions access latest --secret=ADMIN_TOKEN --project "$PROJECT_ID")
          S=$(curl -s -o /dev/null -w '%{http_code}\n' -H "X-Admin-Token: $TOK" "$URL/api/status")
          R=$(curl -s -o /dev/null -w '%{http_code}\n' -H "X-Admin-Token: $TOK" -X POST "$URL/api/report")
          echo "HEALTH=$H STATUS=$S REPORT=$R"
          test "$H" = "200" -a "$S" = "200" -a "$R" = "200"
