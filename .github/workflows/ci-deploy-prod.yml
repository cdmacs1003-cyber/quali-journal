name: CI/CD – Prod (Cloud Run)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # OIDC/WIF 토큰 발급 필수  :contentReference[oaicite:12]{index=12}

env:
  PROJECT_ID: quali-journal-prod
  REGION: asia-northeast1                 # 🟡도메인 매핑 리전과 일치 확인
  SERVICE_NAME: quali-admin-domap         # 🟡운영 서비스명 확인
  AR_REPO: containers
  IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/quali-admin:${{ github.sha }}

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 0) 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 1) WIF(OIDC) 인증 — gcloud보다 반드시 앞  :contentReference[oaicite:13]{index=13}
      - name: Auth to Google Cloud (WIF/OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      # 2) gcloud 설치/초기화
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 3) Python (선택: 에셋 빌드용)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4) 정적 자산 빌드 — admin/ 존재 시에만 실행(없으면 스킵)
      - name: Build hashed assets (auto-detect)
        shell: bash
        run: |
          set -e
          if [ -d "./admin" ]; then
            echo "[assets] admin/ 감지 → 해시 빌드"
            if [ -f "./tools/build_assets_hash.py" ]; then
              python ./tools/build_assets_hash.py --clean || true
            else
              echo "[assets] 스크립트 없음 → 스킵"
            fi
          else
            echo "[assets] admin/ 없음 → 스킵(배포 OK)"
          fi

      # 5) Artifact Registry 로그인
      - name: Configure Docker auth
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" -q

      # 6) 컨테이너 빌드 & 푸시
      - name: Build & Push image
        run: |
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      # 7) Cloud Run 배포(Secret Manager로 ADMIN_TOKEN 주입)
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region:  ${{ env.REGION }}
          image:   ${{ env.IMAGE_URI }}
          flags: >-
            --allow-unauthenticated
            --service-account=run-exec-admin@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --set-secrets=ADMIN_TOKEN=ADMIN_TOKEN:latest
          env_vars: >-
            PYTHONUTF8=1
            COMMIT_SHA=${{ github.sha }}
      # ↑ Secret Manager 주입은 제안서/배포 가이드의 보안 베스트프랙티스. :contentReference[oaicite:14]{index=14} :contentReference[oaicite:15]{index=15}

      # 8) 최신 리비전에 100% 트래픽(안전망)  :contentReference[oaicite:16]{index=16} :contentReference[oaicite:17]{index=17}
      - name: Force traffic to latest
        run: gcloud run services update-traffic "$SERVICE_NAME" --to-latest --region "$REGION" --project "$PROJECT_ID"

      # 9) 스모크 테스트(health/status/report → 모두 200 기대)  :contentReference[oaicite:18]{index=18} :contentReference[oaicite:19]{index=19}
      - name: Smoke tests
        shell: bash
        run: |
          set -e
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          H=$(curl -s -o /dev/null -w '%{http_code}\n' "$URL/health")
          TOK=$(gcloud secrets versions access latest --secret=ADMIN_TOKEN --project "$PROJECT_ID")
          S=$(curl -s -o /dev/null -w '%{http_code}\n' -H "X-Admin-Token: $TOK" "$URL/api/status")
          R=$(curl -s -o /dev/null -w '%{http_code}\n' -H "X-Admin-Token: $TOK" -X POST -H "Content-Length: 0" "$URL/api/report")
          echo "health=$H status=$S report=$R"
          test "$H" = "200" -a "$S" = "200" -a "$R" = "200"
