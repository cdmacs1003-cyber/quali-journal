name: ci-deploy-prod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: quali-journal-prod
  REGION: asia-northeast1
  SERVICE_NAME: quali-admin-domap
  # ✅ 엔트리포인트는 admin.server_quali:app 이 맞다
  ENTRYPOINT: uvicorn admin.server_quali:app --host 0.0.0.0 --port 8080

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (source)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE_NAME }}
          source: .
          allow_unauthenticated: true
          timeout: 300
          # ✅ 트래픽 지정은 이렇게: LATEST=100
          revision_traffic: "LATEST=100"
          # 실행 시 환경변수(로그/포트 등)
          env_vars: COMMIT_SHA=${{ github.sha }},PYTHONUNBUFFERED=1,PORT=8080
          # 시크릿 주입
          secrets: ADMIN_TOKEN=ADMIN_TOKEN:latest
          # 라벨 1회만 지정 (중복 지정 에러 방지)
          labels: managed-by=github-actions,commit-sha=${{ github.sha }}
          # ✅ Buildpacks용 ENTRYPOINT 지정
          flags: >-
            --build-env-vars=GOOGLE_ENTRYPOINT="${{ env.ENTRYPOINT }}"

      - name: Show deployed service URL
        run: |
          gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)'

      - name: Warmup (wait for /health 200)
        run: |
          set -e
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)')
          echo "URL=$URL"
          for i in $(seq 1 90); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health")
            echo "try $i: $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "warmup failed: /health not ready"; exit 1
