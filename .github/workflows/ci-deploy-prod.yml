name: deploy

on:
  push:
    branches: [ "main" ]       # main으로 push될 때 자동 배포
  workflow_dispatch:           # 필요 시 수동 실행

permissions:
  contents: read
  id-token: write              # WIF(OIDC) 토큰용 권한

env:
  # ==== SSOT ====
  PROJECT_ID:        quali-journal-prod
  REGION:            asia-northeast1
  SERVICE_NAME:      quali-admin-domap
  AR_REPO:           containers
  RUNTIME_SA:        quali-run-sa
  IMAGE: asia-northeast1-docker.pkg.dev/quali-journal-prod/containers/quali-admin-domap:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      # 0) 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 1) WIF(OIDC)로 GCP 인증
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account:           ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
          project_id:                ${{ env.PROJECT_ID }}

      # 2) gcloud CLI 세팅
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # 3) Cloud Build로 루트 Dockerfile 빌드
      - name: Build image with Cloud Build
        run: |
          gcloud builds submit \
            --tag "${{ env.IMAGE }}" \
            --project "${{ env.PROJECT_ID }}"

      # 4) Cloud Run에 이미지 배포
      - name: Deploy to Cloud Run (image)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id:  ${{ env.PROJECT_ID }}
          region:      ${{ env.REGION }}
          service:     ${{ env.SERVICE_NAME }}
          image:       ${{ env.IMAGE }}
          env_vars: |
            PYTHONUTF8=1
            PYTHONIOENCODING=utf-8
            COMMIT_SHA=${{ github.sha }}
            ALLOWED_ORIGINS=https://admin.standardai.co.kr
          secrets: |
            ADMIN_TOKEN=ADMIN_TOKEN:latest
          flags: >
            --allow-unauthenticated
            --service-account=${{ env.RUNTIME_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          update_traffic_flags: --to-latest

      # 5) 배포된 서비스 URL 확인
      - name: Show deployed service URL
        id: url
        run: |
          SERVICE_NAME="${{ env.SERVICE_NAME }}"
          REGION="${{ env.REGION }}"
          PROJECT_ID="${{ env.PROJECT_ID }}"
          URL=$(gcloud run services describe "$SERVICE_NAME" \
                --region "$REGION" \
                --project "$PROJECT_ID" \
                --format="value(status.url)")
          echo "URL=$URL"
          echo "URL=$URL" >> "$GITHUB_OUTPUT"

      # 6) Warmup: /health 200 나올 때까지 대기
      - name: Warmup (wait for /health 200)
        run: |
          set -e
          URL="${{ steps.url.outputs.URL }}"
          echo "URL=$URL"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || true)
            echo "try $i: $code"
            if [ "$code" = "200" ]; then
              echo "health OK"
              exit 0
            fi
            sleep 3
          done
          echo "warmup failed: /health not ready"
          exit 1

      # 7) Smoke test: /api/status, /api/report 200 확인
      - name: Smoke tests (/api/status, /api/report)
        run: |
          set -e
          URL="${{ steps.url.outputs.URL }}"
          PROJECT_ID="${{ env.PROJECT_ID }}"
          TOKEN=$(gcloud secrets versions access latest \
                    --secret=ADMIN_TOKEN \
                    --project "$PROJECT_ID" | tr -d '\r\n')
          for P in /api/status /api/report; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "X-Admin-Token: $TOKEN" \
                    "$URL$P" || true)
            echo "$P -> $code"
            [ "$code" = "200" ] || (echo "Smoke failed: $P $code" && exit 1)
          done
          echo "Smoke OK"
