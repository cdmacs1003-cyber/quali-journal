name: Deploy (Dockerfile) — admin + domap

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: quali-journal-prod
  # 서울(소스 서비스)
  REGION_ADMIN: asia-northeast3
  SERVICE_ADMIN: quali-journal-admin
  # 도쿄(도메인 매핑 서비스)
  REGION_DOMAP: asia-northeast1
  SERVICE_DOMAP: quali-admin-domap
  # 커밋 SHA 태그로 이미지 버전 관리
  IMAGE_URI: gcr.io/${{ env.PROJECT_ID }}/admin:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
         workload_identity_provider: "projects/665690300029/locations/global/workloadIdentityPools/github-wif/providers/github-oidc"
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: beta
          export_default_credentials: true

      # 컨테이너 import/시크릿 읽기 문제 사전 차단
      - name: Preflight IAM (service agent + runtime SA)
        shell: bash
        run: |
          set -euo pipefail
          PROJ="${{ env.PROJECT_ID }}"
          NUM="$(gcloud projects describe "$PROJ" --format='value(projectNumber)')"

          # Cloud Run 서비스 에이전트 생성(있으면 통과)
          gcloud beta services identity create --service run.googleapis.com --project "$PROJ" >/dev/null 2>&1 || true

          # 구형/신형 둘 다 권한 부여(존재하는 쪽만 성공)
          AGENT1="service-${NUM}@serverless-robot-prod.iam.gserviceaccount.com"
          AGENT2="service-${NUM}@gcp-sa-run.iam.gserviceaccount.com"
          for SA in "$AGENT1" "$AGENT2"; do
            gcloud projects add-iam-policy-binding "$PROJ" --member "serviceAccount:${SA}" --role roles/artifactregistry.reader || true
            gcloud projects add-iam-policy-binding "$PROJ" --member "serviceAccount:${SA}" --role roles/storage.objectViewer || true
          done

          # 런타임 SA(없으면 생성)
          RUNTIME_SA="run-exec-admin@${PROJ}.iam.gserviceaccount.com"
          gcloud iam service-accounts create run-exec-admin --project "$PROJ" >/dev/null 2>&1 || true
          gcloud projects add-iam-policy-binding "$PROJ" --member "serviceAccount:${RUNTIME_SA}" --role roles/secretmanager.secretAccessor || true
          gcloud projects add-iam-policy-binding "$PROJ" --member "serviceAccount:${RUNTIME_SA}" --role roles/artifactregistry.reader || true

          echo "RUNTIME_SA=${RUNTIME_SA}" >> "$GITHUB_ENV"

      - name: Configure Docker auth
        run: gcloud auth configure-docker --quiet

      - name: Build & Push (Dockerfile)
        run: gcloud builds submit --project "${{ env.PROJECT_ID }}" --tag "${{ env.IMAGE_URI }}" .

      - name: Deploy admin (image, Seoul)
        run: |
          gcloud run deploy "${{ env.SERVICE_ADMIN }}" \
            --image "${{ env.IMAGE_URI }}" \
            --region "${{ env.REGION_ADMIN }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${{ env.RUNTIME_SA }}" \
            --set-secrets "ADMIN_TOKEN=ADMIN_TOKEN:latest" \
            --set-env-vars "PYTHONUTF8=1,PYTHONIOENCODING=utf-8"

      - name: Deploy domap (image, Tokyo) + to-latest
        run: |
          gcloud run deploy "${{ env.SERVICE_DOMAP }}" \
            --image "${{ env.IMAGE_URI }}" \
            --region "${{ env.REGION_DOMAP }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets "ADMIN_TOKEN=ADMIN_TOKEN:latest" \
            --set-env-vars "PYTHONUTF8=1,PYTHONIOENCODING=utf-8"
          gcloud run services update-traffic "${{ env.SERVICE_DOMAP }}" \
            --region "${{ env.REGION_DOMAP }}" --to-latest

      - name: Smoke tests (admin)
        shell: bash
        run: |
          set -e
          URL=$(gcloud run services describe "${{ env.SERVICE_ADMIN }}" --region "${{ env.REGION_ADMIN }}" --format='value(status.url)')
          [ -n "$URL" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health"); [ "$code" = "200" ]
          TOKEN=$(gcloud secrets versions access latest --secret=ADMIN_TOKEN --project "${{ env.PROJECT_ID }}")
          for EP in status report; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Admin-Token: $TOKEN" "$URL/api/$EP"); [ "$code" = "200" ]
          done

      - name: Smoke tests (domap)
        shell: bash
        run: |
          set -e
          URL=$(gcloud run services describe "${{ env.SERVICE_DOMAP }}" --region "${{ env.REGION_DOMAP }}" --format='value(status.url)')
          [ -n "$URL" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health"); [ "$code" = "200" ]
          TOKEN=$(gcloud secrets versions access latest --secret=ADMIN_TOKEN --project "${{ env.PROJECT_ID }}")
          for EP in status report; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Admin-Token: $TOKEN" "$URL/api/$EP"); [ "$code" = "200" ]
          done
