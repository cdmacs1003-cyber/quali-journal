          def matrix_rows():
              rows = []
              for case_id in ALL_CASES:
                  case_samples = sorted(
                      (item for item in samples if item["case_id"] == case_id),
                      key=lambda item: item["sample_index"],
                  )
                  verdicts = [item["verdict"] for item in case_samples]
                  signatures = {item["signature_digest"] for item in case_samples}
                  requirement = "REQUIRED" if case_id in REQUIRED_CASES else "OPTIONAL"
                  signature_valid = all(
                      item["signature_digest"]
                      == digest(
                          {
                              key: value
                              for key, value in item.items()
                              if key not in ("sample_index", "signature_digest")
                          }
                      )
                      for item in case_samples
                  )
                  indices_valid = [
                      item["sample_index"] for item in case_samples
                  ] == list(range(1, SAMPLE_COUNT + 1))
                  requirements_valid = all(
                      item["requirement"] == requirement for item in case_samples
                  )
                  stable = (
                      len(case_samples) == SAMPLE_COUNT
                      and len(signatures) == 1
                      and signature_valid
                      and indices_valid
                      and requirements_valid
                  )
                  if requirement == "REQUIRED":
                      verdict = "PASS" if stable and verdicts == ["PASS"] * SAMPLE_COUNT else "FAIL"
                  else:
                      optional_ok = verdicts in (
                          ["PASS"] * SAMPLE_COUNT,
                          ["OPTIONAL_UNAVAILABLE"] * SAMPLE_COUNT,
                      )
                      verdict = verdicts[0] if stable and optional_ok else "FAIL"
                  rows.append(
                      {
                          "case_id": case_id,
                          "requirement": requirement,
                          "verdict": verdict,
                          "stable": stable,
                          "pass_count": verdicts.count("PASS"),
                          "optional_unavailable_count": verdicts.count(
                              "OPTIONAL_UNAVAILABLE"
                          ),
                          "fail_count": verdicts.count("FAIL"),
                          "signature_count": len(signatures),
                      }
                  )
              return rows


          def raw_schema_count(value):
              forbidden_keys = {
                  "pid",
                  "ppid",
                  "pgid",
                  "command",
                  "command_line",
                  "environment",
                  "token",
                  "username",
                  "url",
                  "response",
                  "response_body",
                  "path",
              }
              count = 0
              if isinstance(value, dict):
                  for key, nested in value.items():
                      if key.lower() in forbidden_keys:
                          count += 1
                      count += raw_schema_count(nested)
              elif isinstance(value, list):
                  for nested in value:
                      count += raw_schema_count(nested)
              return count


          def build_evidence():
              matrix = matrix_rows()
              try:
                  final_counts = measured_process_counts()
                  final_counts["direct_child_count"] = len(direct_child_ids())
                  final_counts["registry_residual_count"] = len(owned)
                  final_counts["group_registry_residual_count"] = len(groups)
                  final_counts["measurement_failure_count"] = 0
              except BaseException:
                  final_counts = {
                      "task_owned_process_count": 1,
                      "task_owned_live_count": 1,
                      "descendant_count": 1,
                      "orphan_count": 1,
                      "zombie_count": 1,
                      "unresolved_wait_count": counters[
                          "unresolved_wait_count"
                      ],
                      "unrelated_signal_count": counters[
                          "unrelated_signal_count"
                      ],
                      "unrelated_termination_count": counters[
                          "unrelated_termination_count"
                      ],
                      "timeout_leak_count": counters["timeout_leak_count"],
                      "cleanup_error_count": counters["cleanup_error_count"],
                      "blocked_unowned_signal_count": counters[
                          "blocked_unowned_signal_count"
                      ],
                      "direct_child_count": 1,
                      "registry_residual_count": len(owned),
                      "group_registry_residual_count": len(groups),
                      "measurement_failure_count": 1,
                  }
              final_counts["raw_persistence_count"] = 0
              final_counts["wrong_pass_claim_count"] = 0
              unstable_count = sum(1 for row in matrix if not row["stable"])
              required_ok = all(
                  row["verdict"] == "PASS" and row["stable"]
                  for row in matrix
                  if row["requirement"] == "REQUIRED"
              )
              optional_ok = all(
                  row["verdict"] in ("PASS", "OPTIONAL_UNAVAILABLE")
                  and row["stable"]
                  for row in matrix
                  if row["requirement"] == "OPTIONAL"
              )
              counts_ok = all(value == 0 for value in final_counts.values())
              eligible_before_raw_audit = (
                  primary_failure_code == "NONE"
                  and cleanup_failure_code == "NONE"
                  and current_case == "NONE"
                  and len(samples) == len(ALL_CASES) * SAMPLE_COUNT
                  and required_ok
                  and optional_ok
                  and counts_ok
              )
              evidence = {
                  "schema": "QLIB_D41_LINUX_HOST_ATTESTATION_V1",
                  "task_id": TASK_ID,
                  "source_commit": metadata["source_commit"],
                  "run_id_digest": metadata["run_id_digest"],
                  "runner": {
                      "label": "UBUNTU_LATEST",
                      "image_os": metadata["image_os"],
                      "image_version": metadata["image_version"],
                      "os": "LINUX" if eligible_before_raw_audit else "NOT_VERIFIED",
                      "arch": "X86_64" if eligible_before_raw_audit else "NOT_VERIFIED",
                      "python_contract": "CPYTHON_GE_3_10",
                      "python_supported": eligible_before_raw_audit,
                  },
                  "execution": {
                      "trigger": "PUSH_BOOTSTRAP",
                      "trigger_scope_verified": eligible_before_raw_audit,
                      "manual_dispatch": "DECLARED_NOT_DEFAULT_BRANCH_ACTIVE",
                      "automatic_retry": False,
                      "samples_per_case": SAMPLE_COUNT,
                      "task_owned_signal_count": counters[
                          "task_owned_signal_count"
                      ],
                  },
                  "samples": samples,
                  "matrix": matrix,
                  "final": final_counts,
                  "summary": {
                      "required_case_count": len(REQUIRED_CASES),
                      "optional_case_count": len(OPTIONAL_CASES),
                      "planned_sample_count": len(ALL_CASES) * SAMPLE_COUNT,
                      "completed_sample_count": len(samples),
                      "unstable_case_count": unstable_count,
                  },
                  "failure": {
                      "primary_code": primary_failure_code,
                      "cleanup_code": cleanup_failure_code,
                      "evidence_build_code": "NONE",
                      "case_id": current_case,
                  },
                  "selected_verdict": "FAIL",
              }
              final_counts["raw_persistence_count"] = raw_schema_count(evidence)
              eligible = (
                  eligible_before_raw_audit
                  and final_counts["raw_persistence_count"] == 0
              )
              evidence["selected_verdict"] = "PASS" if eligible else "FAIL"
              final_counts["wrong_pass_claim_count"] = int(
                  evidence["selected_verdict"] == "PASS" and not eligible
              )
              evidence["evidence_digest"] = digest(evidence)
              return evidence


          def build_failsafe_evidence():
              evidence = {
                  "schema": "QLIB_D41_LINUX_HOST_ATTESTATION_V1",
                  "task_id": TASK_ID,
                  "source_commit": metadata["source_commit"],
                  "run_id_digest": metadata["run_id_digest"],
                  "runner": {
                      "label": "UBUNTU_LATEST",
                      "image_os": metadata["image_os"],
                      "image_version": metadata["image_version"],
                      "os": "NOT_VERIFIED",
                      "arch": "NOT_VERIFIED",
                      "python_contract": "CPYTHON_GE_3_10",
                      "python_supported": False,
                  },
                  "execution": {
                      "trigger": "PUSH_BOOTSTRAP",
                      "trigger_scope_verified": False,
                      "manual_dispatch": "DECLARED_NOT_DEFAULT_BRANCH_ACTIVE",
                      "automatic_retry": False,
                      "samples_per_case": SAMPLE_COUNT,
                      "task_owned_signal_count": counters[
                          "task_owned_signal_count"
                      ],
                  },
                  "samples": [],
                  "matrix": [],
                  "final": {
                      "task_owned_process_count": 1,
                      "task_owned_live_count": 1,
                      "descendant_count": 1,
                      "orphan_count": 1,
                      "zombie_count": 1,
                      "unresolved_wait_count": counters[
                          "unresolved_wait_count"
                      ],
                      "unrelated_signal_count": counters[
                          "unrelated_signal_count"
                      ],
                      "unrelated_termination_count": counters[
                          "unrelated_termination_count"
                      ],
                      "timeout_leak_count": counters["timeout_leak_count"],
                      "cleanup_error_count": counters["cleanup_error_count"],
                      "blocked_unowned_signal_count": counters[
                          "blocked_unowned_signal_count"
                      ],
                      "direct_child_count": 1,
                      "registry_residual_count": len(owned),
                      "group_registry_residual_count": len(groups),
                      "measurement_failure_count": 1,
                      "raw_persistence_count": 0,
                      "wrong_pass_claim_count": 0,
                  },
                  "summary": {
                      "required_case_count": len(REQUIRED_CASES),
                      "optional_case_count": len(OPTIONAL_CASES),
                      "planned_sample_count": len(ALL_CASES) * SAMPLE_COUNT,
                      "completed_sample_count": 0,
                      "unstable_case_count": len(ALL_CASES),
                  },
                  "failure": {
                      "primary_code": primary_failure_code,
                      "cleanup_code": cleanup_failure_code,
                      "evidence_build_code": "EVIDENCE_BUILD_FAILURE",
                      "case_id": current_case,
                  },
                  "selected_verdict": "FAIL",
              }
              evidence["final"]["raw_persistence_count"] = raw_schema_count(
                  evidence
              )
              evidence["evidence_digest"] = digest(evidence)
              return evidence


          def emit(evidence):
              print("QLIB_D41_EVIDENCE_BEGIN")
              print(canonical_bytes(evidence).decode("ascii"))
              print("QLIB_D41_EVIDENCE_END")


          try:
              execute_campaign()
          except AttestationFailure:
              primary_failure_code = "CAPABILITY_FAILURE"
          except BaseException:
              primary_failure_code = "INTERNAL_FAILURE"
          finally:
              try:
                  cleanup_remaining()
              except BaseException:
                  cleanup_failure_code = "CLEANUP_FAILURE"
              if (
                  counters["cleanup_error_count"] != 0
                  or counters["timeout_leak_count"] != 0
              ):
                  cleanup_failure_code = "CLEANUP_FAILURE"

          try:
              result = build_evidence()
          except BaseException:
              result = build_failsafe_evidence()
          emit(result)
          raise SystemExit(0 if result["selected_verdict"] == "PASS" else 1)
          PY
