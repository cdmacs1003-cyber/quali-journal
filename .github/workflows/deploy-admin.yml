name: Deploy Admin and Domap (Cloud Run)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-admin
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PROJECT_ID: quali-journal-prod
  REGION_ADMIN: asia-northeast3
  SERVICE_ADMIN: quali-journal-admin
  REGION_DOMAP: asia-northeast1
  SERVICE_DOMAP: quali-admin-domap
  BUILD_CONTEXT: admin
  DOMAIN: admin.standardai.co.kr

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # step 0 - source
      - name: Checkout
        uses: actions/checkout@v4

      # step 1 - install gcloud (install only)
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: "beta"

      # step 1.5 - normalize WIF secret and decide auth inputs
      # strip hidden chars( CR/LF/TAB/SPACE ) and trailing ':'
      # validate format and expose sanitized value via outputs
      - name: Decide auth strategy (sanitize WIF)
        id: wif
        env:
          WIF_RAW: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -Eeuo pipefail
          printf "::notice::WIF_RAW(len=%s)='%s'\n" "${#WIF_RAW}" "${WIF_RAW}"

          # 1) sanitize: remove CR/LF/TAB/SPACE, then drop trailing ':'
          WIF_CLEAN="$(printf '%s' "${WIF_RAW}" | tr -d '\r\n\t ' | sed 's/:$//')"

          printf "::notice::WIF_CLEAN(len=%s)='%s'\n" "${#WIF_CLEAN}" "${WIF_CLEAN}"

          # 2) format check: projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
          echo "${WIF_CLEAN}" | grep -Eq '^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$' || {
            echo "::error::WIF format invalid: ${WIF_CLEAN}"
            exit 1
          }

          # 3) expose outputs
          {
            echo "wif=${WIF_CLEAN}"
            echo "sa=${SA_EMAIL}"
          } >> "${GITHUB_OUTPUT}"

      # step 2 - authenticate with sanitized audience (keyless WIF)
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.wif.outputs.wif }}
          service_account: ${{ steps.wif.outputs.sa }}
          create_credentials_file: true

      # step 2.5 - verify provider existence/state/issuer (defensive)
      - name: WIF provider verify (post-auth)
        env:
          WIF: ${{ steps.wif.outputs.wif }}
        run: |
          set -Eeuo pipefail
          POOL_ID="$(echo "$WIF" | awk -F'/workloadIdentityPools/|/providers/' '{print $2}')"
          PROVIDER_ID="$(basename "$WIF")"
          echo "::notice::POOL_ID=$POOL_ID, PROVIDER_ID=$PROVIDER_ID"

          gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
            --location=global --workload-identity-pool="$POOL_ID" \
            --format='yaml(name,oidc.issuerUri,disabled,oidc.attributeCondition)' || {
              echo "::error::Provider not found or no permission for: $WIF"
              exit 1
            }

          ISSUER="$(gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
            --location=global --workload-identity-pool="$POOL_ID" --format='value(oidc.issuerUri)')"
          DISABLED="$(gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
            --location=global --workload-identity-pool="$POOL_ID" --format='value(disabled)')"

          if [ "$DISABLED" = "True" ] || [ "$DISABLED" = "true" ]; then
            echo "::error::Provider is disabled"
            exit 1
          fi
          if [ "$ISSUER" != "https://token.actions.githubusercontent.com" ]; then
            echo "::error::Issuer mismatch: $ISSUER"
            exit 1
          fi
          echo "::notice::WIF provider verify OK"

      # gate 1 - verify build context
      - name: Gate 1 - verify build context
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: |
          set -Eeuo pipefail
          echo "pwd=$(pwd)"
          ls -la
          ok=0
          for f in requirements.txt pyproject.toml Dockerfile server_quali.py; do
            if [ -f "$f" ]; then ok=1; fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::no known build files in $(pwd)"
            exit 1
          fi

      # step 3 - deploy admin from source (Seoul)
      - name: Deploy admin (source, Seoul)
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: |
          set -Eeuo pipefail
          gcloud run deploy "${SERVICE_ADMIN}" \
            --project "${PROJECT_ID}" \
            --region "${REGION_ADMIN}" \
            --source . \
            --allow-unauthenticated \
            --set-secrets "ADMIN_TOKEN=ADMIN_TOKEN:latest" \
            --set-env-vars "PYTHONUTF8=1,PYTHONIOENCODING=utf-8,ARCHIVE_DIR=/tmp/archive"
          gcloud run services update-traffic "${SERVICE_ADMIN}" \
            --project "${PROJECT_ID}" \
            --region "${REGION_ADMIN}" \
            --to-latest

      # step 4 - read deployed admin image for domap reuse
      - name: Read admin image
        id: img
        run: |
          set -Eeuo pipefail
          IMG="$(gcloud run services describe "${SERVICE_ADMIN}" \
                 --project "${PROJECT_ID}" \
                 --region "${REGION_ADMIN}" \
                 --format='value(spec.template.spec.containers[0].image)')"
          if [ -z "${IMG}" ]; then
            echo "::error::failed to read admin image"
            exit 1
          fi
          echo "image=${IMG}" >> "${GITHUB_OUTPUT}"

      # step 5 - deploy domap using the same image (Tokyo)
      - name: Deploy domap (image, Tokyo)
        run: |
          set -Eeuo pipefail
          gcloud run deploy "${SERVICE_DOMAP}" \
            --project "${PROJECT_ID}" \
            --region "${REGION_DOMAP}" \
            --image "${{ steps.img.outputs.image }}" \
            --allow-unauthenticated \
            --set-secrets "ADMIN_TOKEN=ADMIN_TOKEN:latest" \
            --set-env-vars "PYTHONUTF8=1,PYTHONIOENCODING=utf-8,ARCHIVE_DIR=/tmp/archive"
          gcloud run services update-traffic "${SERVICE_DOMAP}" \
            --project "${PROJECT_ID}" \
            --region "${REGION_DOMAP}" \
            --to-latest

      # gate 2 - domain mapping must point to domap service
      - name: Gate 2 - domain mapping route check
        run: |
          set -Eeuo pipefail
          ROUTE="$(gcloud beta run domain-mappings describe \
                    --domain "${DOMAIN}" \
                    --project "${PROJECT_ID}" \
                    --region "${REGION_DOMAP}" \
                    --format='value(spec.routeName)' || true)"
          echo "domain=${DOMAIN} route=${ROUTE}"
          if [ "${ROUTE}" != "${SERVICE_DOMAP}" ]; then
            echo "::error::domain maps to ${ROUTE:-<empty>} (expected ${SERVICE_DOMAP})"
            exit 1
          fi

      # gate 3 - both services must send 100 percent to LATEST
      - name: Gate 3 - admin traffic must be 100 percent to LATEST
        run: |
          set -Eeuo pipefail
          T="$(gcloud run services describe "${SERVICE_ADMIN}" \
               --project "${PROJECT_ID}" \
               --region "${REGION_ADMIN}" \
               --format='value(status.traffic)')"
          echo "admin traffic=${T}"
          echo "${T}" | grep -q 'LATEST' || { echo "::error::admin not pointing to LATEST"; exit 1; }
          echo "${T}" | grep -q '100'   || { echo "::error::admin traffic not 100 percent"; exit 1; }

      - name: Gate 3 - domap traffic must be 100 percent to LATEST
        run: |
          set -Eeuo pipefail
          T="$(gcloud run services describe "${SERVICE_DOMAP}" \
               --project "${PROJECT_ID}" \
               --region "${REGION_DOMAP}" \
               --format='value(status.traffic)')"
          echo "domap traffic=${T}"
          echo "${T}" | grep -q 'LATEST' || { echo "::error::domap not pointing to LATEST"; exit 1; }
          echo "${T}" | grep -q '100'   || { echo "::error::domap traffic not 100 percent"; exit 1; }

      # step 6 - smoke tests for domap (health, status with token, report)
      - name: Smoke tests (domap)
        run: |
          set -Eeuo pipefail
          URL="$(gcloud run services describe "${SERVICE_DOMAP}" \
                 --project "${PROJECT_ID}" \
                 --region "${REGION_DOMAP}" \
                 --format='value(status.url)')"
          if [ -z "${URL}" ]; then
            echo "::error::failed to read domap url"
            exit 1
          fi
          TOKEN="$(gcloud secrets versions access latest \
                   --secret=ADMIN_TOKEN \
                   --project="${PROJECT_ID}")"
          code=$(curl -fsS -o /dev/null -w "%{http_code}" "${URL}/health") || code=000
          if [ "$code" -ne 200 ]; then echo "::error::/health=$code"; exit 1; fi
          code=$(curl -fsS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" "${URL}/api/status") || code=000
          if [ "$code" -ne 200 ]; then echo "::error::/api/status=$code"; exit 1; fi
          code=$(curl -fsS -o /dev/null -w "%{http_code}" "${URL}/api/report") || code=000
          if [ "$code" -ne 200 ]; then echo "::error::/api/report=$code"; exit 1; fi
          echo "Smoke OK: ${URL}"

      # step 7 - summary
      - name: Summary
        run: |
          set -Eeuo pipefail
          echo "::notice::Deploy finished: admin=${SERVICE_ADMIN}@${REGION_ADMIN}, domap=${SERVICE_DOMAP}@${REGION_DOMAP}"
