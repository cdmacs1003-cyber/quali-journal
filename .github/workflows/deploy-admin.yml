name: Deploy Admin (Dockerfile@admin)

on:
  push:
    branches: [ "main", "fix/include-html" ]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE: quali-journal-admin
  PROJECT_ID: ${{ secrets.GOOGLE_PROJECT }}
  REGION: ${{ secrets.GOOGLE_REGION }}
  REPO: ${{ secrets.ARTIFACT_REPO }}
  IMAGE_TAG: asia-northeast3-docker.pkg.dev/${{ secrets.GOOGLE_PROJECT }}/${{ secrets.ARTIFACT_REPO }}/admin:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin   # ★ 반드시 admin에서 빌드

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gcloud"

      - name: Print gcloud info
        run: gcloud --version

      - name: Build & Push (Artifact Registry)
        run: |
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
          gcloud builds submit . --tag "${IMAGE_TAG}" --project "${PROJECT_ID}"

      - name: Deploy to Cloud Run (SRC)
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE_TAG}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --allow-unauthenticated

      - name: Route 100% to latest
        run: gcloud run services update-traffic "${SERVICE}" --to-latest --region "${REGION}" --project "${PROJECT_ID}"

      - name: Smoke /health
        run: |
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format="value(status.url)")
          code=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health")
          echo "HEALTH=${code}"
          test "${code}" = "200"
