name: Deploy Admin (Dockerfile@admin)

on:
  push:
    branches: [ "main" ]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

# 같은 브랜치에서 겹치면 이전 실행 취소
concurrency:
  group: deploy-admin-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE: quali-journal-admin
  PROJECT_ID: ${{ secrets.GOOGLE_PROJECT || 'quali-journal-prod' }}
  REGION:     ${{ secrets.GOOGLE_REGION  || 'asia-northeast3' }}
  REPO:       ${{ secrets.ARTIFACT_REPO || 'quali-repo' }}
  IMAGE_TAG:  asia-northeast3-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/admin:${{ github.sha }}-${{ github.run_number }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      # 필수 env 누락 가드
      - name: Guard env (PROJECT_ID/REGION)
        if: ${{ env.PROJECT_ID == '' || env.REGION == '' }}
        run: |
          echo "PROJECT_ID='${{ env.PROJECT_ID }}'  REGION='${{ env.REGION }}'"
          echo "::error::Missing GA secrets GOOGLE_PROJECT/GOOGLE_REGION"
          exit 1

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gcloud

      - name: Sanity (WIF)
        run: |
          gcloud auth list
          gcloud projects describe "${{ env.PROJECT_ID }}" --format="value(projectNumber)"
          gcloud services list --enabled --project "${{ env.PROJECT_ID }}" | grep -E "run|artifact|cloudbuild|iamcredentials|secret" || true

      - name: Build & Push (Artifact Registry)
        run: |
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
          gcloud builds submit . \
            --gcs-source-staging-dir=gs://${{ env.PROJECT_ID }}-cloudbuild/source \
            --tag "${{ env.IMAGE_TAG }}" \
            --project "${{ env.PROJECT_ID }}"

      - name: Deploy to Cloud Run (SRC)
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "${{ env.IMAGE_TAG }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --allow-unauthenticated

      - name: Route 100% to latest
        run: |
          gcloud run services update-traffic "${{ env.SERVICE }}" --to-latest \
            --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}"

      - name: Smoke /health (retry)
        shell: bash
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE }}" --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}" --format="value(status.url)")
          echo "URL=${URL}"
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health")
            echo "try $i: ${code}"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "health check failed"; exit 1

      # ⬇︎ 요청하신 /api/status(토큰) 스모크 — 앵커 바로 아래 삽입
      - name: Smoke /api/status (token)
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE }}" \
                --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}" \
                --format="value(status.url)")
          code=$(curl -s -o /dev/null -w "%{http_code}" \
                 -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                 "${URL}/api/status")
          echo "STATUS=${code}"
          test "${code}" = "200"


