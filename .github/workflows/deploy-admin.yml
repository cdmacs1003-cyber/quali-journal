name: Deploy Admin and Domap (Cloud Run)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-admin
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PROJECT_ID: quali-journal-prod
  REGION_ADMIN: asia-northeast3
  SERVICE_ADMIN: quali-journal-admin
  REGION_DOMAP: asia-northeast1
  SERVICE_DOMAP: quali-admin-domap
  BUILD_CONTEXT: admin
  DOMAIN: admin.standardai.co.kr

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Auth - Workload Identity Federation (no keys)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true   # export GOOGLE_APPLICATION_CREDENTIALS

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: "beta"
          
      # Gate 1 - sanity check for build context (simple and robust)
      - name: Gate 1 - verify build context
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: |
          set -Eeuo pipefail
          echo "pwd=$(pwd)"
          ls -la
          ok=0
          for f in requirements.txt pyproject.toml Dockerfile server_quali.py; do
            if [ -f "$f" ]; then ok=1; fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::no known build files found in $(pwd)"
            exit 1
          fi

      # Deploy admin from source (Seoul)
      - name: Deploy admin (source, Seoul)
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: |
          set -Eeuo pipefail
          gcloud run deploy "${SERVICE_ADMIN}" \
            --project "${PROJECT_ID}" \
            --region "${REGION_ADMIN}" \
            --source . \
            --allow-unauthenticated \
            --set-secrets "ADMIN_TOKEN=ADMIN_TOKEN:latest" \
            --set-env-vars "PYTHONUTF8=1,PYTHONIOENCODING=utf-8,ARCHIVE_DIR=/tmp/archive"
          gcloud run services update-traffic "${SERVICE_ADMIN}" \
            --project "${PROJECT_ID}" \
            --region "${REGION_ADMIN}" \
            --to-latest

      # Read image of the deployed admin
      - name: Read admin image
        id: img
        run: |
          set -Eeuo pipefail
          IMG="$(gcloud run services describe "${SERVICE_ADMIN}" \
                 --project "${PROJECT_ID}" \
                 --region "${REGION_ADMIN}" \
                 --format='value(spec.template.spec.containers[0].image)')"
          if [ -z "${IMG}" ]; then
            echo "::error::failed to read admin image"
            exit 1
          fi
          echo "image=${IMG}" >> "${GITHUB_OUTPUT}"

      # Deploy domap reusing the same image (Tokyo)
      - name: Deploy domap (image, Tokyo)
        run: |
          set -Eeuo pipefail
          gcloud run deploy "${SERVICE_DOMAP}" \
            --project "${PROJECT_ID}" \
            --region "${REGION_DOMAP}" \
            --image "${{ steps.img.outputs.image }}" \
            --allow-unauthenticated \
            --set-secrets "ADMIN_TOKEN=ADMIN_TOKEN:latest" \
            --set-env-vars "PYTHONUTF8=1,PYTHONIOENCODING=utf-8,ARCHIVE_DIR=/tmp/archive"
          gcloud run services update-traffic "${SERVICE_DOMAP}" \
            --project "${PROJECT_ID}" \
            --region "${REGION_DOMAP}" \
            --to-latest

      # Gate 2 - domain mapping must point to domap service
      - name: Gate 2 - domain mapping route check
        run: |
          set -Eeuo pipefail
          ROUTE="$(gcloud beta run domain-mappings describe \
                    --domain "${DOMAIN}" \
                    --project "${PROJECT_ID}" \
                    --region "${REGION_DOMAP}" \
                    --format='value(spec.routeName)' || true)"
          if [ "${ROUTE}" != "${SERVICE_DOMAP}" ]; then
            echo "::error::domain maps to ${ROUTE:-<empty>} (expected ${SERVICE_DOMAP})"
            exit 1
          fi

      # Gate 3 - both services must send 100 percent to LATEST
      - name: Gate 3 - traffic must be 100 percent to LATEST (admin)
        run: |
          set -Eeuo pipefail
          T="$(gcloud run services describe "${SERVICE_ADMIN}" \
               --project "${PROJECT_ID}" \
               --region "${REGION_ADMIN}" \
               --format='value(status.traffic)')"
          echo "${T}"
          echo "${T}" | grep -q 'LATEST' || { echo "::error::admin not pointing to LATEST"; exit 1; }
          echo "${T}" | grep -q '100'   || { echo "::error::admin traffic not 100 percent"; exit 1; }

      - name: Gate 3 - traffic must be 100 percent to LATEST (domap)
        run: |
          set -Eeuo pipefail
          T="$(gcloud run services describe "${SERVICE_DOMAP}" \
               --project "${PROJECT_ID}" \
               --region "${REGION_DOMAP}" \
               --format='value(status.traffic)')"
          echo "${T}"
          echo "${T}" | grep -q 'LATEST' || { echo "::error::domap not pointing to LATEST"; exit 1; }
          echo "${T}" | grep -q '100'   || { echo "::error::domap traffic not 100 percent"; exit 1; }

      # Smoke - health, status (token), report
      - name: Smoke tests (domap)
        run: |
          set -Eeuo pipefail
          URL="$(gcloud run services describe "${SERVICE_DOMAP}" \
                 --project "${PROJECT_ID}" \
                 --region "${REGION_DOMAP}" \
                 --format='value(status.url)')"
          if [ -z "${URL}" ]; then
            echo "::error::failed to read domap url"
            exit 1
          fi
          TOKEN="$(gcloud secrets versions access latest \
                   --secret=ADMIN_TOKEN \
                   --project "${PROJECT_ID}")"
          curl -fsS -o /dev/null "${URL}/health"
          curl -fsS -o /dev/null -H "Authorization: Bearer ${TOKEN}" "${URL}/api/status"
          curl -fsS -o /dev/null "${URL}/api/report"
          echo "Smoke OK - ${URL}"

      - name: Summary
        run: |
          set -Eeuo pipefail
          echo "::notice::Deploy finished. Admin=${SERVICE_ADMIN}@${REGION_ADMIN}, Domap=${SERVICE_DOMAP}@${REGION_DOMAP}"
