name: Deploy Admin DOMAP (Cloud Run)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: quali-journal-prod
  REGION: asia-northeast1
  SERVICE: quali-admin-domap
  AR_HOST: asia-northeast1-docker.pkg.dev
  AR_REPO: qualijournal/qj-admin
  VERIFY_REPORT_SCRIPTS: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gcloud 설치는 PR/Push 공통 (Pre-gate에서 사용)
      - name: Setup gcloud (install only)
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # WIF 인증은 main push 에서만
      - name: Google Auth (WIF/OIDC)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Compute image tag
        run: |
          set -euo pipefail
          echo "IMG=${{ env.AR_HOST }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      # -------- Pre-gate: 업로드 목록 필수 파일 확인 (항상 실행) --------
      - name: "Pre-gate: files to be uploaded"
        run: |
          set -euo pipefail
          gcloud meta list-files-for-upload > _upload.txt
          missing=0
          require() { grep -Fq -- "$1" _upload.txt || { echo "::error ::Missing in upload (pattern): $1"; missing=1; }; }
          require "server_quali.py"
          require "requirements.txt"
          require "orchestrator.py"
          require "make_daily_report.py"
          require "config.json"
          if grep -Fq -- "admin/index.html" _upload.txt || grep -Fq -- "index.html" _upload.txt; then :; else
            echo "::error ::Missing in upload (pattern): admin/index.html or index.html"; missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "---- upload list (first 200 lines) ----"
            sed -n '1,200p' _upload.txt
            exit 1
          fi

      # -------- 이하 단계는 main push 에서만 --------
      - name: Build image (Cloud Build)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          gcloud builds submit --tag "$IMG" --project "${{ env.PROJECT_ID }}"

      - name: Docker auth for Artifact Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: gcloud --quiet auth configure-docker ${{ env.AR_HOST }}

      - name: Verify image contents (files exist)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          docker pull "$IMG"
          docker run --rm "$IMG" sh -lc '
            set -eu
            missing=0
            for f in /app/server_quali.py /app/requirements.txt; do
              [ -f "$f" ] || { echo "::error ::Missing $f"; missing=1; }
            done
            if [ -f /app/admin/index.html ] || [ -f /app/index.html ]; then :; else
              echo "::error ::Missing /app/admin/index.html (or /app/index.html)"; missing=1
            fi
            if [ "$missing" -ne 0 ]; then find /app -maxdepth 2 -type f | sed -n "1,120p"; exit 1; fi
          '

      - name: Verify report scripts (optional)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.VERIFY_REPORT_SCRIPTS == 'true' }}
        run: |
          set -euo pipefail
          docker run --rm "$IMG" sh -lc 'test -f /app/orchestrator.py && test -f /app/make_daily_report.py'

      - name: "Verify ASGI import (server_quali:app)"
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          docker run --rm "$IMG" python -c "import importlib,sys; m=importlib.import_module('server_quali'); ok=hasattr(m,'app'); print('server_quali.app =', ok); sys.exit(0 if ok else 1)"

      # -------- 배포 (main) --------
      - name: Snapshot previous revision
        id: prev
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          echo "prev=$(gcloud run services describe '${{ env.SERVICE }}' --region '${{ env.REGION }}' --format='value(status.latestCreatedRevisionName)')" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run (no-traffic)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "$IMG" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --quiet \
            --no-traffic

      - name: Smoke /health
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "${{ env.SERVICE }}" --region "${{ env.REGION }}" --format='value(status.url)')
          curl -fsS "$URL/health" >/dev/null

      - name: Route 100% traffic to latest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ env.SERVICE }}" --region "${{ env.REGION }}" --to-latest

      - name: Assert revision updated
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          NEW=$(gcloud run services describe '${{ env.SERVICE }}' --region '${{ env.REGION }}' --format='value(status.latestCreatedRevisionName)')
          echo "prev=${{ steps.prev.outputs.prev }} | new=${NEW}"
          [ "$NEW" != "${{ steps.prev.outputs.prev }}" ] || (echo "::error ::Revision not updated" && exit 1)
