name: Deploy Admin (DOMAP - asia-northeast1)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-admin-domap-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: quali-journal-prod
  REGION: asia-northeast1
  SERVICE: quali-admin-domap
  ART_REG: asia-northeast1-docker.pkg.dev
  REPO: qualijournal
  IMAGE_NAME: qj-admin

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== OIDC 인증 (MAIN/수동만 실행) =====
      - name: Google Auth (WIF)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify OIDC claims (repo/ref)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          set -euo pipefail
          GH_OIDC_JWT=$(curl -s -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://sts.googleapis.com" | jq -r .value)
          echo "$GH_OIDC_JWT" | cut -d'.' -f2 | tr '_-' '/+' | base64 -d > gh-oidc.json || true
          test "$(jq -r .repository gh-oidc.json)" = "${{ github.repository }}"
          test "$(jq -r .ref         gh-oidc.json)" = "${{ github.ref }}"

      # ===== 이미지 태그 =====
      - name: Compose image tag
        run: echo "IMG=${{ env.ART_REG }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_ENV"

      # ===== Pre-gate: 업로드 목록에 필수 파일 존재 확인 (PR/MAIN/수동 모두 수행) =====
      - name: Pre-gate: files to be uploaded
        run: |
          set -euo pipefail
          LIST="$(gcloud meta list-files-for-upload || true)"

          REQUIRED=("server_quali.py" "requirements.txt" "orchestrator.py" "make_daily_report.py")

          if echo "$LIST" | grep -qx "admin/index.html"; then
            echo "✓ found admin/index.html"
          elif echo "$LIST" | grep -qx "index.html"; then
            echo "✓ found index.html"
          else
            echo "Error: Missing in upload (pattern): admin/index.html or index.html"
            exit 1
          fi

          for f in "${REQUIRED[@]}"; do
            echo "$LIST" | grep -qx "$f" || { echo "Error: Missing in upload (pattern): $f"; exit 1; }
          done

          echo "---- upload list (first 200 lines) ----"
          echo "$LIST" | head -n 200

      # ===== Build (MAIN/수동만) =====
      - name: Build image (Cloud Build)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          gcloud builds submit --project "${PROJECT_ID}" \
            --tag "${IMG}" .

      # ===== 이미지 검증 (MAIN/수동만) =====
      - name: Configure Docker auth (Artifact Registry)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: gcloud auth configure-docker ${{ env.ART_REG }} --quiet

      - name: Pull image
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: docker pull "$IMG"

      - name: Verify image contents (Quali Gate)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          docker run --rm "$IMG" sh -lc '
            set -eu
            [ -f /app/server_quali.py ] && [ -f /app/requirements.txt ] && \
            ( [ -f /app/admin/index.html ] || [ -f /app/index.html ] ) && \
            [ -f /app/orchestrator.py ] && [ -f /app/make_daily_report.py ]
          '

      - name: Verify ASGI entry (server_quali:app)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          docker run --rm "$IMG" python -c "import server_quali as m; assert hasattr(m,'app')"

      # ===== 이전 리비전 스냅샷 (롤백 대비) =====
      - name: Snapshot previous live revision
        id: live
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          echo "prev=$(gcloud run services describe '${SERVICE}' --region '${REGION}' \
            --format='value(status.traffic[0].revisionName)')" >> "$GITHUB_OUTPUT"

      # ===== 배포(no-traffic) → 최신 리비전에 트래픽 우선 전환 =====
      - name: Deploy (no-traffic)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMG}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --no-traffic

      - name: Traffic to latest 100%
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          gcloud run services update-traffic "${SERVICE}" --region "${REGION}" --to-latest

      # ===== 스모크 /health (실패 시 즉시 롤백) =====
      - name: Smoke /health (run.app) with rollback
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.url)')
          if ! curl -fsS "$URL/health" >/dev/null ; then
            echo "Health failed → rollback to previous live revision: ${{ steps.live.outputs.prev }}"
            gcloud run services update-traffic "${SERVICE}" --region "${REGION}" \
              --to-revisions "${{ steps.live.outputs.prev }}=100"
            exit 1
          fi

      # ===== 최신 리비전/트래픽 보증 =====
      - name: Assert latest=100%
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          TRAF=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.traffic)')
          echo "$TRAF" | grep -q "latestRevision': True" || (echo "::error ::latestRevision not live" && exit 1)
          echo "$TRAF"

