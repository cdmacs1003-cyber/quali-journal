name: Deploy Admin (domap)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Prevent overlapping runs for same branch
concurrency:
  group: deploy-admin-domap-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GCP_PROJECT: quali-journal-prod
  GCP_REGION: asia-northeast1
  SERVICE: quali-admin-domap
  BUILD_CONTEXT: admin
  REQUIRE_DB: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 0) Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Build hashed assets (produces dist/)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build hashed assets (admin context)
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: |
          set -euo pipefail
          python tools/build_assets_hash.py --clean

      - name: Show built assets
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: |
          echo "::group::dist tree"
          ls -la dist || true
          echo "::endgroup::"

      # 2) Authentication — prefer WIF, fallback to SA JSON key
      - name: Authenticate to Google Cloud (WIF)
        id: auth_wif
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (SA key fallback)
        id: auth_json
        if: ${{ steps.auth_wif.outcome == 'failure' && secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Fail if auth missing
        if: ${{ steps.auth_wif.outcome == 'failure' && (secrets.GCP_SA_KEY == '' || secrets.GCP_SA_KEY == null) }}
        run: |
          echo "::error::WIF auth failed and no GCP_SA_KEY provided for fallback."
          exit 1

      # 3) Setup gcloud
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          install_components: "beta"

      - name: Configure Docker auth
        run: gcloud auth configure-docker --quiet

      # 4) Inject BUILD_ID (commit short SHA) into service-worker.js
      - name: Inject BUILD_ID into service-worker.js
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          if [[ ! -f service-worker.js ]]; then
            echo "::error::service-worker.js not found in $(pwd)"
            exit 1
          fi
          sed -i "s/__BUILD_ID__/${SHORT_SHA}/g" service-worker.js
          echo "BUILD_ID=${SHORT_SHA}"

      # 5) Gate — require dist outputs
      - name: Gate — dist outputs must exist
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html not found"; exit 1; }
          test -d dist/assets     || { echo "::error::dist/assets not found"; exit 1; }
          ls dist/assets/app.*.js   >/dev/null 2>&1 || { echo "::error::dist/assets/app.*.js missing"; exit 1; }
          ls dist/assets/style.*.css >/dev/null 2>&1 || { echo "::error::dist/assets/style.*.css missing"; exit 1; }

      # 6) Deploy to Cloud Run from admin context
      - name: Deploy to Cloud Run (admin context)
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --region "${GCP_REGION}" \
            --source . \
            --set-env-vars BUILD_ID=${{ github.sha }},COMMIT_SHA=${{ github.sha }} \
            --quiet
          gcloud run services update-traffic "${SERVICE}" \
            --region "${GCP_REGION}" \
            --to-latest


      # 7) Post-deploy checks
      - name: Traffic must be 100% to LATEST
        run: |
          set -euo pipefail
          T="$(gcloud run services describe "${SERVICE}" --region "${GCP_REGION}" --format='value(status.traffic)')"
          echo "$T"
          echo "$T" | grep -q 'LATEST' || { echo "::error::traffic not pointing to LATEST"; exit 1; }
          echo "$T" | grep -q '100'   || { echo "::error::traffic not 100%"; exit 1; }

      - name: Domain mapping route must match service
        run: |
          set -euo pipefail
          R="$(gcloud beta run domain-mappings describe --domain admin.standardai.co.kr --region "${GCP_REGION}" --format='value(spec.routeName)' || true)"
          if [[ -z "$R" ]]; then
            echo "::warning::Domain mapping not found (skipping strict check)"
            exit 0
          fi
          [[ "$R" == "${SERVICE}" ]] || { echo "::error::domain maps to $R (expected ${SERVICE})"; exit 1; }

      # 8) Optional: block if Cloud SQL is stopped
      - name: Policy — fail if Cloud SQL is STOPPED
        if: ${{ env.REQUIRE_DB == 'true' }}
        run: |
          set -euo pipefail
          STATE="$(gcloud sql instances describe quali-pg --format='value(state)' || true)"
          [[ "$STATE" != "STOPPED" ]] || { echo "::error::Cloud SQL is STOPPED; deployment blocked."; exit 1; }
