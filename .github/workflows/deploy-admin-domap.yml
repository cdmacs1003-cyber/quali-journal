name: Deploy Admin (domap)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      auth:
        description: "auth mode (json|oidc). default=json"
        required: false
        default: "json"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: quali-journal-prod
  GCP_REGION: asia-northeast1
  SERVICE: quali-admin-domap
  BUILD_CONTEXT: admin
  REQUIRE_DB: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Auth 전략 결정: GCP_SA_KEY가 있으면 항상 json로 강제 ---
      - name: Decide auth strategy
        id: decide
        shell: bash
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_SA: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          AUTH_INPUT: ${{ github.event.inputs.auth }}
        run: |
          set -euo pipefail
          if [[ -n "$SA_KEY" ]]; then
            echo "strategy=json" >> $GITHUB_OUTPUT
            echo "Using SA key (forced)"
          elif [[ "${AUTH_INPUT:-json}" == "json" ]]; then
            echo "::error::GCP_SA_KEY secret missing."
            exit 1
          elif [[ -n "$WIF_PROVIDER" && -n "$WIF_SA" ]]; then
            echo "strategy=oidc" >> $GITHUB_OUTPUT
            echo "Using OIDC(WIF)"
          else
            echo "::error::No valid auth secrets. Set GCP_SA_KEY or WIF secrets."
            exit 1
          fi

      - name: Authenticate to Google Cloud (SA key)
        if: steps.decide.outputs.strategy == 'json'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud (WIF)
        if: steps.decide.outputs.strategy == 'oidc'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          install_components: "beta"

      - name: Configure Docker auth
        run: gcloud auth configure-docker --quiet

      # ---------- Gate 1: 업로드 목록 ----------
      - name: Gate 1 — upload list (admin context)
        working-directory: ${{ env.BUILD_CONTEXT }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud meta list-files-for-upload | tee /tmp/upload.txt
          req=( 'index.html' 'assets/style.css' 'assets/app.js' 'requirements.txt' 'server_quali.py' )
          ok=1
          for f in "${req[@]}"; do
            egrep -q "(^|[/\\])${f}$" /tmp/upload.txt || { echo "::error::missing in upload: ${f}"; ok=0; }
          done
          test $ok -eq 1

      # ---------- Deploy ----------
      - name: Deploy to Cloud Run (admin context)
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" --region "${GCP_REGION}" --source . --quiet
          gcloud run services update-traffic "${SERVICE}" --region "${GCP_REGION}" --to-latest

      # ---------- Gate 2: 이미지 내용 ----------
      - name: Gate 2 — image content (skip if Docker unavailable)
        shell: bash
        run: |
          set -euo pipefail
          IMG="$(gcloud run services describe "${SERVICE}" --region "${GCP_REGION}" --format='value(spec.template.spec.containers[0].image)')"
          if docker info >/dev/null 2>&1; then
            docker pull "${IMG}" >/dev/null
            docker run --rm "${IMG}" sh -lc 'set -e;
              f(){ find / -maxdepth "$1" -type f -name "$2" 2>/dev/null | head -n1; };
              test -n "$(f 4 index.html)";
              test -n "$(f 6 style.css)";
              test -n "$(f 6 app.js)";
              test -n "$(f 4 requirements.txt)"'
          else
            echo "Docker unavailable → skipping image gate"
          fi

      # ---------- 정책/트래픽/도메인 ----------
      - name: Policy — fail if Cloud SQL is STOPPED
        if: env.REQUIRE_DB == 'true'
        run: |
          STATE="$(gcloud sql instances describe quali-pg --format='value(state)' || true)"
          [ "$STATE" != "STOPPED" ] || { echo "::error::Cloud SQL is STOPPED; deployment blocked."; exit 1; }

      - name: Traffic must be 100% to LATEST
        run: |
          T="$(gcloud run services describe "${SERVICE}" --region "${GCP_REGION}" --format='value(status.traffic)')"
          echo "$T" | grep -q 'LATEST' || { echo "::error::traffic not pointing to LATEST"; exit 1; }
          echo "$T" | grep -q '100'   || { echo "::error::traffic not 100%"; exit 1; }

      - name: Domain mapping route must match service
        run: |
          R="$(gcloud beta run domain-mappings describe --domain admin.standardai.co.kr --region "${GCP_REGION}" --format='value(spec.routeName)' || true)"
          test "$R" = "${SERVICE}" || { echo "::error::domain maps to $R (expected ${SERVICE})"; exit 1; }

