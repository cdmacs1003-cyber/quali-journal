name: Deploy Admin LIVE (safe rollout)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "admin/**"
      - "Dockerfile"
      - "requirements.txt"
      - "requirements-optional.txt"
      - ".gcloudignore"
      - ".github/workflows/deploy-admin-domap.yml"

permissions:
  contents: read
  id-token: write

# ▶ 모든 step을 저장소 루트에서 실행(재발 방지)
defaults:
  run:
    shell: bash
    working-directory: .

concurrency:
  group: deploy-admin-domap-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GOOGLE_PROJECT }}          # 예: quali-journal-prod
  REGION: asia-northeast1                            # domap LIVE 리전(도쿄)
  SERVICE_NAME: quali-admin-domap                    # LIVE 서비스명
  AR_REGION: asia-northeast3                         # Artifact Registry 리전(이미지 저장소)
  AR_REPO: ${{ secrets.ARTIFACT_REPO }}              # Artifact Registry 리포 이름

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # admin/ 폴더가 있으면 admin, 없으면 루트(.)를 빌드 컨텍스트로 사용
      - name: Set build context
        run: |
          if [ -d "admin" ]; then
            echo "CTX=admin" >> "$GITHUB_ENV"
          else
            echo "CTX=." >> "$GITHUB_ENV"
          fi

      - name: Google Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Show repo layout (debug)
        run: |
          pwd && ls -al

      - name: Sanity (whoami)
        run: |
          set -euxo pipefail
          gcloud --version
          gcloud auth list
          gcloud config list

      # 1) Build & Push image --------------------------------------------------
      - name: Build & Push (Cloud Build)
        run: |
          set -euxo pipefail
          IMAGE_REG="${AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/admin"
          IMAGE_TAG="${IMAGE_REG}:${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          gcloud builds submit "$CTX" --tag "${IMAGE_TAG}"

      # 2) Deploy (no-traffic) + commit-sha label -----------------------------
      - name: Deploy (no-traffic, labeled)
        run: |
          set -euxo pipefail
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE_TAG}" \
            --region "${REGION}" \
            --platform managed \
            --project "${PROJECT_ID}" \
            --labels="commit-sha=${GITHUB_SHA},env=prod,deployed-by=github-actions" \
            --no-traffic \
            --allow-unauthenticated

          NEW_REV=$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.latestCreatedRevisionName)')
          # 현재 트래픽 받는 리비전(없을 수 있음)
          PREV_REV=$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.traffic[0].revisionName)')
          if [ -z "${PREV_REV}" ] || [ "${PREV_REV}" = "${NEW_REV}" ]; then
            PREV_REV=$(gcloud run revisions list --service "${SERVICE_NAME}" --region "${REGION}" --project "${PROJECT_ID}" --sort-by="~createTime" --limit=2 --format='value(METADATA.name)' | tail -n 1 || true)
            [ -z "${PREV_REV}" ] && PREV_REV="${NEW_REV}"
          fi
          URL=$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')

          echo "NEW_REV=${NEW_REV}"   >> "$GITHUB_ENV"
          echo "PREV_REV=${PREV_REV}" >> "$GITHUB_ENV"
          echo "URL=${URL}"           >> "$GITHUB_ENV"

      # 3) Canary rollout + smoke + auto rollback ------------------------------
      - name: Traffic split 5% → 20% → 50% → 100% (with rollback)
        env:
          NEW_REV: ${{ env.NEW_REV }}
          PREV_REV: ${{ env.PREV_REV }}
          URL: ${{ env.URL }}
        run: |
          set -euo pipefail
          svc="${SERVICE_NAME}"
          region="${REGION}"
          proj="${PROJECT_ID}"
          new="${NEW_REV}"
          prev="${PREV_REV}"
          url="${URL}"

          # 첫 배포(이전 리비전 없음)면 바로 100%로 전환 후 스모크
          if [ "${new}" = "${prev}" ]; then
            gcloud run services update-traffic "${svc}" --region "${region}" --project "${proj}" --to-revisions "${new}=100"
            code_h=$(curl -fsS -o /dev/null -w '%{http_code}' "${url}/health" || true)
            [ "$code_h" = "200" ] || { echo "health=$code_h"; exit 1; }
            exit 0
          fi

          smoke () {
            pct="$1"
            code_h=$(curl -fsS -o /dev/null -w '%{http_code}' "${url}/health" || true)
            [ "$code_h" = "200" ] || return 1
            return 0
          }

          rollback () {
            echo "!! ROLLBACK: ${prev}=100"
            gcloud run services update-traffic "${svc}" --region "${region}" --project "${proj}" --to-revisions "${prev}=100"
            exit 1
          }

          step () {
            pct="$1"
            echo "→ traffic: ${prev}=$((100-pct))%, ${new}=${pct}%"
            gcloud run services update-traffic "${svc}" --region "${region}" --project "${proj}" \
              --to-revisions "${prev}=$((100-pct)),${new}=${pct}"
            sleep 90
            smoke "${pct}" || rollback
          }

          step 5
          step 20
          step 50
          echo "→ final shift 100% to NEW"
          gcloud run services update-traffic "${svc}" --region "${region}" --project "${proj}" --to-revisions "${new}=100"
          smoke 100 || rollback

      # 4) Evidence: traffic & labels ------------------------------------------
      - name: Show traffic & labels
        run: |
          gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --project "${PROJECT_ID}" \
            --format="yaml(status.traffic,metadata.labels)"
          gcloud run revisions list --service "${SERVICE_NAME}" --region "${REGION}" --project "${PROJECT_ID}" \
            --sort-by="~createTime" --limit=5 \
            --format='table(METADATA.name, metadata.labels["commit-sha"]:label=COMMIT_SHA, createTime)'

      - name: Complete
        run: echo "Done ✅"
