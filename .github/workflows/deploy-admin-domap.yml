name: Deploy admin-domap (WIF)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC 토큰 발급 필수 :contentReference[oaicite:5]{index=5}

env:
  PROJECT_ID: quali-journal-prod
  REGION: asia-northeast1
  SERVICE_NAME: quali-admin-domap
  REPO: qualijournal
  IMAGE_URI: asia-northeast1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/quali-admin:${{ github.sha }}

jobs:
  build-deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- WIF 인증(키리스) ---
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      # 위 2줄이 '최소 구성'의 핵심입니다. :contentReference[oaicite:6]{index=6}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true   # gcloud가 ADC로 토큰 사용 :contentReference[oaicite:7]{index=7}

      # --- 신원 확인 & Provider 상태 점검 ---
      - name: whoami (SA impersonation 확인)
        run: gcloud auth list --filter="status:ACTIVE" --format="value(account)"

      - name: WIF provider 점검(issuer/mapping/state)
        run: |
          set -e
          gcloud iam workload-identity-pools providers describe "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" \
            --location=global --format="yaml(name,issuerUri,attributeMapping,attributeCondition,state)" || \
            echo "skip(describe): 권한 없음 또는 비필수"
      # 참고: 점검 권한 없으면 스킵. 트러블슈팅 가이드 참조. :contentReference[oaicite:8]{index=8}

      # --- 정책 가드: Cloud SQL STOPPED면 차단(옵션) ---
      - name: Fail if Cloud SQL is STOPPED (policy)
        env:
          ENFORCE: "1"   # 필요 없으면 "0"
        run: |
          if [ "$ENFORCE" = "1" ]; then
            STATE=$(gcloud sql instances describe quali-pg --format="value(state)" || true)
            if [ "$STATE" = "STOPPED" ]; then
              echo "::error ::Cloud SQL is STOPPED; deployment blocked."
              exit 1
            fi
          fi
      # 팀 정책 문서 기준. :contentReference[oaicite:9]{index=9}

      # --- Build & Push (Cloud Build) ---
      - name: Build & Push image
        run: gcloud builds submit --tag "${{ env.IMAGE_URI }}" .

      # --- Deploy (no-traffic) ---
      - name: Deploy to Cloud Run (no traffic)
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "${{ env.IMAGE_URI }}" \
            --region "${{ env.REGION }}" \
            --port 8080 \
            --allow-unauthenticated \
            --no-traffic

      # --- 최신 리비전에 100% 전환 ---
      - name: Shift 100% to latest
        run: gcloud run services update-traffic "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" --to-latest
      # 우리 런북의 표준 동작. :contentReference[oaicite:10]{index=10}

      # --- 배포 후 스모크 ---
      - name: Smoke (/health 필수, /api/*는 토큰 있으면)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" --format="value(status.url)")
          echo "Service URL=$URL"
          for e in /health ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$e"); [ "$code" = "200" ] || exit 1
          done
          if [ -n "$ADMIN_TOKEN" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $ADMIN_TOKEN" "$URL/api/status")
            [ "$code" = "200" ] || { echo "warn: /api/status=$code"; exit 1; }
          else
            echo "skip: ADMIN_TOKEN 없음 → /health만 점검"
          fi

      # --- 헤더/캐시 정책(요약 점검) ---
      - name: Headers check (cache/SW)
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" --format="value(status.url)")
          curl -sD - "$URL/" -o /dev/null | grep -i '^Cache-Control' || true
          curl -sD - "$URL/service-worker.js" -o /dev/null | grep -i '^Cache-Control' || true
      # 내부 런북의 헤더/서비스워커 점검을 축약 반영. :contentReference[oaicite:11]{index=11}
