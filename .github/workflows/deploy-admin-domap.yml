name: Deploy Admin LIVE (Dockerfile@admin)

on:
  push:
    branches: [ "main" ]                      # 메인만 자동 배포
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin-domap.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-admin-domap-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_LIVE: quali-journal-admin-domap
  PROJECT_ID: ${{ secrets.GOOGLE_PROJECT }}
  REGION: ${{ secrets.GOOGLE_REGION }}
  REPO: ${{ secrets.ARTIFACT_REPO }}
  IMAGE_TAG: asia-northeast3-docker.pkg.dev/${{ secrets.GOOGLE_PROJECT }}/${{ secrets.ARTIFACT_REPO }}/admin:${{ github.sha }}-${{ github.run_number }}

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gcloud

      - name: Sanity (WIF)
        run: |
          gcloud auth list
          gcloud projects describe "${PROJECT_ID}" --format="value(projectNumber)"
          gcloud services list --enabled --project "${PROJECT_ID}" | grep -E "run|artifact|cloudbuild|iamcredentials|secret" || true

      - name: Build & Push (Artifact Registry)
        run: |
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
          gcloud builds submit . --tag "${IMAGE_TAG}" --project "${PROJECT_ID}"

      - name: Deploy to Cloud Run (LIVE/domap)
        run: |
          gcloud run deploy "${SERVICE_LIVE}" \
            --image "${IMAGE_TAG}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --allow-unauthenticated \
            --set-secrets ADMIN_TOKEN=ADMIN_TOKEN:latest

      - name: Route 100% to latest
        run: |
          gcloud run services update-traffic "${SERVICE_LIVE}" --to-latest \
            --region "${REGION}" --project "${PROJECT_ID}"

      - name: Smoke /health (LIVE, retry)
        shell: bash
        run: |
          URL=$(gcloud run services describe "${SERVICE_LIVE}" --region "${REGION}" --project "${PROJECT_ID}" --format="value(status.url)")
          echo "URL=${URL}"
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health")
            echo "try $i: ${code}"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "health check failed"; exit 1

