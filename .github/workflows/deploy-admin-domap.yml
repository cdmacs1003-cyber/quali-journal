name: Deploy Admin LIVE (Dockerfile@admin)

on:
  push:
    branches: [ "main" ]                      # 硫붿씤留??먮룞 諛고룷
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin-domap.yml"
  workflow_dispatch: {}                        # ?섎룞 ?ㅽ뻾 ?덉슜

permissions:
  contents: read
  id-token: write

# 媛숈? 釉뚮옖移섏뿉??寃뱀튂硫??댁쟾 ?ㅽ뻾 痍⑥냼(?덉젙??
concurrency:
  group: deploy-admin-domap-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_LIVE: quali-journal-admin-domap
  PROJECT_ID: ${{ secrets.GOOGLE_PROJECT }}
  REGION: ${{ secrets.GOOGLE_REGION }}
  REPO: ${{ secrets.ARTIFACT_REPO }}
  # 異붿쟻 ?ъ슫 ?쒓렇(sha-Run踰덊샇)
  IMAGE_TAG: asia-northeast3-docker.pkg.dev/${{ secrets.GOOGLE_PROJECT }}/${{ secrets.ARTIFACT_REPO }}/admin:${{ github.sha }}-${{ github.run_number }}

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin              # ??諛섎뱶??admin/?먯꽌 鍮뚮뱶

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gcloud

      - name: Sanity (WIF)
        run: |
          gcloud auth list
          gcloud projects describe "${{ env.PROJECT_ID }}" --format="value(projectNumber)"
          gcloud services list --enabled --project "${{ env.PROJECT_ID }}" | grep -E "run|artifact|cloudbuild|iamcredentials|secret" || true

      - name: Build & Push (Artifact Registry)
        run: |
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
          gcloud builds submit . --tag "${{ env.IMAGE_TAG }}" --project "${{ env.PROJECT_ID }}"

      - name: Deploy to Cloud Run (LIVE/domap)
        run: |
          gcloud run deploy "${{ env.SERVICE_LIVE }}" \
            --image "${{ env.IMAGE_TAG }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --allow-unauthenticated \
            --set-secrets ADMIN_TOKEN=ADMIN_TOKEN:latest

      - name: Route 100% to latest
        run: |
          gcloud run services update-traffic "${{ env.SERVICE_LIVE }}" --to-latest \
            --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}"

      - name: Smoke /health (LIVE, retry)
        shell: bash
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_LIVE }}" --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}" --format="value(status.url)")
          echo "URL=${URL}"
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health")
            echo "try $i: ${code}"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "health check failed"; exit 1

