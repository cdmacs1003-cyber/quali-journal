name: L3 B-canary smoke

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: "Cloud Run revision name (e.g. quali-admin-domap-00221-bsz)"
        required: true
        type: string
      profile:
        description: "L3 B안 프로파일 (S1_99_1 / S2_80_20 / S3_50_50 / S4_100_0)"
        required: true
        type: choice
        options:
          - S1_99_1
          - S2_80_20
          - S3_50_50
          - S4_100_0
        default: S4_100_0
      base_url:
        description: "Admin base URL"
        required: false
        default: "https://admin.standardai.co.kr"
        type: string

env:
  PROJECT_ID: quali-journal-prod
  REGION_TYO: asia-northeast1
  SERVICE_LIVE: quali-admin-domap

jobs:
  l3-b-canary-smoke:
    runs-on: ubuntu-latest

    # L3 B-canary는 관리자 토큰이 반드시 필요
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ADMIN_TOKEN 이 실제로 들어오는지 길이만 체크
      - name: Debug ADMIN_TOKEN presence
        shell: pwsh
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if ($env:ADMIN_TOKEN) {
            Write-Host "ADMIN_TOKEN length = $($env:ADMIN_TOKEN.Length)"
          } else {
            Write-Host "ADMIN_TOKEN is EMPTY"
          }

      - name: Run L3 B-canary smoke
        shell: pwsh
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION_TYO: ${{ env.REGION_TYO }}
          SERVICE_LIVE: ${{ env.SERVICE_LIVE }}
          EXPECTED_REVISION: ${{ github.event.inputs.expected_revision }}
          BASE_URL: ${{ github.event.inputs.base_url }}
          PROFILE: ${{ github.event.inputs.profile }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          # ===== 입력/환경 정리 =====
          $PROJECT     = $env:PROJECT_ID
          $REGION_TYO  = $env:REGION_TYO
          $SERVICE     = $env:SERVICE_LIVE

          $ExpectedRevision = $env:EXPECTED_REVISION
          $BaseUrl          = $env:BASE_URL
          $Profile          = $env:PROFILE

          if (-not $BaseUrl) {
            $BaseUrl = "https://admin.standardai.co.kr"
          }

          if ($BaseUrl.EndsWith("/")) {
            $BaseUrl = $BaseUrl.TrimEnd("/")
          }

          if (-not $ExpectedRevision) {
            throw "expected_revision input is empty."
          }

          if (-not $env:ADMIN_TOKEN) {
            throw "ADMIN_TOKEN environment variable is empty. Check GitHub Secrets / workflow env."
          }

          Write-Host "PROJECT_ID     = $PROJECT"
          Write-Host "REGION_TYO     = $REGION_TYO"
          Write-Host "SERVICE_LIVE   = $SERVICE"
          Write-Host "ExpectedRevision = $ExpectedRevision"
          Write-Host "BaseUrl          = $BaseUrl"
          Write-Host "Profile          = $Profile"

          # ===== 스크립트 위치 탐색 =====
          if ($env:GITHUB_WORKSPACE) {
            $root = $env:GITHUB_WORKSPACE
          } else {
            $root = $PWD
          }

          $scriptPath1 = Join-Path $root "tools/smoke_stdreviews_A_gates.ps1"
          $scriptPath2 = Join-Path $root "admin/tools/smoke_stdreviews_A_gates.ps1"

          Write-Host "GITHUB_WORKSPACE = $root"
          Write-Host "Candidate script paths:"
          Write-Host " - $scriptPath1"
          Write-Host " - $scriptPath2"

          if (Test-Path $scriptPath1) {
            $ScriptPath = $scriptPath1
          } elseif (Test-Path $scriptPath2) {
            $ScriptPath = $scriptPath2
          } else {
            Write-Host "smoke_stdreviews_A_gates.ps1 not found under workspace."
            Write-Host "Workspace tree (top level):"
            Get-ChildItem $root
            throw "L3 smoke script not found in tools/ or admin/tools under workspace."
          }

          Write-Host "Loading L3 smoke script from $ScriptPath"
          . $ScriptPath

          # ===== L3 B안 REV_NEW 헤더 기반 스모크 실행 =====
          $ok = Test-StdReviewRevisionSample `
            -BaseUrl          $BaseUrl `
            -ExpectedRevision $ExpectedRevision `
            -AdminToken       $env:ADMIN_TOKEN

          if (-not $ok) {
            throw "L3 B-canary REV_NEW 헤더 스모크 실패: ExpectedRevision=$ExpectedRevision"
          }

          Write-Host "L3 B-canary REV_NEW 헤더 스모크 성공"
