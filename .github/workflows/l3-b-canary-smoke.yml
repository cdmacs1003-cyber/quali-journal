name: L3 B-canary smoke

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: "Cloud Run revision name (e.g. quali-admin-domap-00221-bsz)"
        required: true
        type: string
      profile:
        description: "L3 B안 프로파일 (S1_99_1 / S2_80_20 / S3_50_50 / S4_100_0)"
        required: true
        type: choice
        options:
          - S1_99_1
          - S2_80_20
          - S3_50_50
          - S4_100_0
        default: S4_100_0
      base_url:
        description: "Admin base URL"
        required: false
        default: "https://admin.standardai.co.kr"
        type: string

env:
  PROJECT_ID: quali-journal-prod
  REGION_TYO: asia-northeast1
  SERVICE_LIVE: quali-admin-domap

jobs:
  l3-b-canary-smoke:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ADMIN_TOKEN 이 실제로 들어오는지 길이만 체크
      - name: Debug ADMIN_TOKEN presence
        shell: pwsh
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if ($env:ADMIN_TOKEN) {
            Write-Host "ADMIN_TOKEN length = $($env:ADMIN_TOKEN.Length)"
          } else {
            Write-Host "ADMIN_TOKEN is EMPTY"
          }

      - name: Run L3 B-canary smoke
        shell: pwsh
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION_TYO: ${{ env.REGION_TYO }}
          SERVICE_LIVE: ${{ env.SERVICE_LIVE }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          # ===== 입력값 정리 =====
          $baseUrl = "${{ github.event.inputs.base_url }}"
          if (-not $baseUrl) {
            $baseUrl = "https://admin.standardai.co.kr"
          }

          $expectedRevision = "${{ github.event.inputs.expected_revision }}"
          if (-not $expectedRevision) {
            throw "expected_revision input is empty."
          }

          if (-not $env:ADMIN_TOKEN) {
            throw "ADMIN_TOKEN is empty."
          }

          Write-Host "L3 B-canary smoke via clean script"
          Write-Host "BaseUrl          = $baseUrl"
          Write-Host "ExpectedRevision = $expectedRevision"
          Write-Host "PROJECT_ID       = $env:PROJECT_ID"
          Write-Host "REGION_TYO       = $env:REGION_TYO"
          Write-Host "SERVICE_LIVE     = $env:SERVICE_LIVE"

          # tools 폴더에서 새 L3B clean 스크립트 실행
          & "tools/smoke_stdreviews_L3B_clean.ps1" `
            -BaseUrl $baseUrl `
            -ExpectedRevision $expectedRevision `
            -AdminToken $env:ADMIN_TOKEN
